ógica',q:'Un centro universitario ayuda a estudiantes con métodos de estudio y elección de empleo. ¿Qué tipo de psicólogo trabaja allí?',o:['Orientador psicológico','Psicólogo evolutivo','Genetista conductual','Neuropsicólogo clínico'],a:0,e:'La orientación psicológica atiende problemas educativos, sociales y de adaptación profesional.'},\n{m:0,area:'Roles y lugares de trabajo',q:'¿Cuáles son los tres roles principales del psicólogo en la sociedad?',o:['Terapeuta, juez y asesor','Maestro, científico y profesional clínico','Investigador, gerente y orientador','Consultor, escritor y médico'],a:1,e:'Muchos los combinan en ambientes académicos.'},\n{m:1,area:'Escuelas tempranas',q:'El estructuralismo buscaba:',o:['Estudiar para qué sirve la mente','Percibir totalidades y patrones','Dividir la mente en componentes básicos mediante la introspección','Medir solo la conducta observable'],a:2,e:'Wundt y Titchener analizaban la estructura de la mente; el funcionalismo preguntaba por su función.'},\n{m:1,area:'Perspectivas: psicodinámica',q:'¿Qué perspectiva explica la conducta por fuerzas inconscientes internas?',o:['Cognitiva','Conductual','Humanista','Psicodinámica'],a:3,e:'Es la perspectiva asociada con Freud.'},\n{m:1,area:'Perspectivas: conductual',q:'La perspectiva que se limita a la conducta observable, moldeada por el ambiente, es la:',o:['Conductual','Neurociencia','Cognitiva','Humanista'],a:0,e:'La conductual pone atención en la «persona externa».'},\n{m:1,area:'Controversias fundamentales',q:'La controversia «libre albedrío vs. determinismo» pregunta:',o:['Si pesa más la herencia o el ambiente','Si las personas eligen sus actos o los determinan factores fuera de su control','Si la conducta es estable o cambia','Si lo consciente importa más que lo inconsciente'],a:1,e:'La opción sobre herencia y ambiente es naturaleza-crianza.'},\n{m:2,area:'Teorías e hipótesis',q:'Una explicación general de un fenómeno de interés se llama:',o:['Hipótesis','Réplica','Teoría','Variable'],a:2,e:'La hipótesis es una predicción comprobable derivada de la teoría.'},\n{m:2,area:'Métodos descriptivos',q:'¿Qué método consiste en observar el comportamiento en su ambiente real sin intervenir?',o:['Estudio de caso','Observación naturalista','Investigación por encuestas','Investigación documental'],a:1,e:'Su debilidad: las personas pueden cambiar su conducta si saben que las observan.'},\n{m:2,area:'Correlación y causalidad',q:'«Correlación no implica causalidad» significa que:',o:['Dos variables relacionadas no prueban que una cause la otra','Las correlaciones nunca son útiles','Solo las encuestas pueden mostrar causas','Una correlación alta demuestra la causa'],a:0,e:'Solo el experimento permite concluir causa y efecto.'},\n{m:2,area:'Experimentos y variables',q:'En un experimento, la variable que el investigador manipula es la:',o:['Dependiente','Controlada por el grupo','Aleatoria','Independiente'],a:3,e:'La dependiente es la que se mide como resultado.'},\n{m:3,area:'Consentimiento informado',q:'El consentimiento informado incluye:',o:['Solo el procedimiento del estudio','El procedimiento, los riesgos y el derecho a retirarse','Solo los resultados esperados','El pago a los participantes'],a:1,e:'Procedimiento + riesgos + derecho a retirarse en cualquier momento.'},\n{m:3,area:'Sesgo experimental y placebo',q:'¿Para qué sirve un placebo?',o:['Para aumentar la participación','Para identificar al grupo experimental','Para controlar el sesgo experimental','Para proteger la privacidad'],a:2,e:'Permite separar el efecto real del efecto de la expectativa.'},\n{m:3,area:'Diversidad de participantes',q:'Elegir participantes representativos permite que los hallazgos:',o:['Reflejen la diversidad del comportamiento humano','Sean más rápidos de obtener','Se limiten a un solo grupo','Eviten el consentimiento'],a:0,e:'Una muestra de un solo grupo no representa a todos.'},\n{m:0,area:'Subcampos: desarrollo',q:'La psicología del desarrollo estudia:',o:['Solo la infancia','El crecimiento y la transformación de las personas desde la concepción hasta la muerte','Los trastornos psicológicos','Las diferencias entre culturas'],a:1,e:'La personalidad, en cambio, se centra en la consistencia del comportamiento y los rasgos individuales.'},\n{m:0,area:'Subcampos: salud',q:'¿Qué subcampo explora la relación entre factores psicológicos, como el estrés, y las enfermedades físicas?',o:['Psicología de la salud','Psicología experimental','Psicología intercultural','Genética conductual'],a:0,e:'Evalúa, por ejemplo, el efecto del estrés en la salud a largo plazo.'},\n{m:0,area:'Subcampos: social e intercultural',q:'La psicología social se ocupa de:',o:['Los mecanismos de genes y cromosomas','La influencia de los pensamientos, sentimientos y acciones de las personas en los demás','El diagnóstico de trastornos','Los procesos de sensación y percepción'],a:1,e:'Estudia temas como agresividad, amor, persuasión y obediencia.'},\n{m:0,area:'Psicología evolutiva',q:'La psicología evolutiva parte de los argumentos de:',o:['Sigmund Freud','William James','Charles Darwin','Wilhelm Wundt'],a:2,e:'Plantea que la herencia genética influye en rasgos y conductas que ayudaron a sobrevivir.'},\n{m:1,area:'Escuelas tempranas: funcionalismo',q:'El funcionalismo, impulsado por William James, se preguntaba:',o:['Cuáles son los elementos básicos de la mente','Qué función cumplen la mente y la conducta para adaptarse al ambiente','Cómo se perciben las totalidades','Qué ocurre en el inconsciente'],a:1,e:'El estructuralismo analizaba las piezas; el funcionalismo, su utilidad.'},\n{m:1,area:'Perspectivas: humanista',q:'La perspectiva humanista destaca:',o:['La actividad cerebral','El libre albedrío y la búsqueda del potencial propio','Las fuerzas inconscientes','El procesamiento de información'],a:1,e:'Resalta las cualidades únicas de la especie humana.'},\n{m:1,area:'Escuelas tempranas: Gestalt',q:'La psicología Gestalt sostiene que:',o:['La mente se divide en elementos mínimos','Solo importa la conducta observable','Percibimos patrones y totalidades, no solo elementos aislados','Los impulsos infantiles guían la conducta'],a:2,e:'Su idea clave es que el todo es más que la suma de las partes.'},\n{m:1,area:'Controversias fundamentales',q:'La controversia «naturaleza-crianza» plantea:',o:['Si la conducta es observable o interna','Si pesa más la herencia o el ambiente en el comportamiento','Si somos libres o determinados','Si el cambio es posible'],a:1,e:'La mayoría de los psicólogos acepta que ambos influyen.'},\n{m:2,area:'Teorías e hipótesis',q:'Una hipótesis es:',o:['Una explicación general de un fenómeno','Una predicción comprobable derivada de una teoría','El resultado final de un experimento','Un grupo de participantes'],a:1,e:'Para comprobarla se necesita una definición operacional.'},\n{m:2,area:'Métodos descriptivos',q:'¿Cuál es una debilidad de la investigación por encuestas?',o:['Los participantes no responden nunca','La gente puede mentir para dar buena imagen','Solo sirve para un caso','Altera el ambiente natural'],a:1,e:'La observación naturalista, en cambio, puede alterar la conducta de quien se sabe observado.'},\n{m:2,area:'Experimentos: grupos',q:'En un experimento, el grupo de control:',o:['Recibe el tratamiento','Es el que el investigador manipula','No recibe el tratamiento y sirve de comparación','Se elige siempre sin azar'],a:2,e:'El grupo experimental es el que recibe el tratamiento.'},\n{m:2,area:'Experimentos: asignación aleatoria',q:'La asignación aleatoria significa que:',o:['Cada participante tiene la misma probabilidad de quedar en cualquier condición','Los participantes eligen su grupo','Solo se observan casos extremos','El investigador decide quién recibe el tratamiento'],a:0,e:'Así los grupos son comparables al comienzo.'},\n{m:3,area:'Ética: protección del daño',q:'Una de las pautas éticas básicas es proteger a los participantes de:',o:['Cualquier pregunta','Daño físico y mental','La privacidad','Los resultados'],a:1,e:'Junto con la privacidad y la participación voluntaria.'},\n{m:3,area:'Ética: participación voluntaria',q:'Participar en una investigación debe ser:',o:['Obligatorio si el estudio es importante','Completamente voluntario','Voluntario solo al inicio','Decidido por el investigador'],a:1,e:'El participante puede retirarse en cualquier momento.'},\n{m:3,area:'Animales en la investigación',q:'El debate sobre el uso de animales en la investigación psicológica consiste en:',o:['Si los animales pueden dar consentimiento','Si los beneficios de la investigación justifican el posible daño','Si deben usarse en vez de personas siempre','Si su conducta es igual a la humana'],a:1,e:'Es una pregunta abierta en el módulo 4.'}\n];\nQB.push(\nmk(0,'Metas de la psicología','¿Cuáles son metas de los psicólogos?','Describir, predecir y explicar el comportamiento y los procesos mentales, y ayudar a mejorar la vida de las personas',['Solo diagnosticar trastornos','Únicamente observar animales','Reemplazar a la intuición con la especulación'],'Además, usan métodos científicos para obtener respuestas más válidas que la intuición.'),\nmk(0,'Definición de la psicología','¿Por qué se prefieren los métodos científicos a la intuición y la especulación?','Porque producen respuestas más válidas y legítimas',['Porque son más rápidos','Porque evitan la observación','Porque no requieren datos'],'La intuición y la especulación suelen ser imprecisas.'),\nmk(0,'Psicología cognitiva','La psicología cognitiva se concentra en:','Los procesos mentales superiores, como pensamiento, memoria, razonamiento y lenguaje',['Los genes y cromosomas','Los problemas de adaptación profesional','El crecimiento desde la concepción'],'Es una subespecialidad de la psicología experimental.'),\nmk(0,'Psicología clínica','La psicología clínica se ocupa del:','Estudio, diagnóstico y tratamiento de los trastornos psicológicos',['Estudio de las diferencias entre culturas','Examen de la herencia de los ancestros','Asesoría sobre métodos de estudio'],'Va desde crisis cotidianas hasta condiciones como la depresión profunda.'),\nmk(0,'Subcampos: personalidad','La psicología de la personalidad se concentra en:','La consistencia del comportamiento en el tiempo y los rasgos que diferencian a un individuo de otro',['La influencia de otros en la conducta','Los procesos de sensación y percepción','El tratamiento de trastornos'],'La del desarrollo estudia el cambio a lo largo de la vida.'),\nmk(0,'Psicología social e intercultural','Un psicólogo que compara el uso del castigo en la crianza infantil entre culturas trabaja en la psicología:','Intercultural',['Experimental','De la salud','Clínica'],'La intercultural investiga semejanzas y diferencias entre culturas y grupos étnicos.'),\nmk(0,'Genética conductual','La genética conductual se concentra en:','Los mecanismos biológicos, como genes y cromosomas, que permiten que se desarrolle el comportamiento heredado',['Los argumentos de la selección natural únicamente','La psicología del lenguaje','Los problemas educativos'],'También busca entender cuánto influye el ambiente en que se manifiesten los rasgos.'),\nmk(0,'Roles y lugares de trabajo','¿Dónde trabaja la mayoría de los psicólogos?','En ambientes académicos',['Solo en prisiones','Únicamente en empresas','Solo en hospitales'],'Eso les permite combinar los roles de maestro, científico y profesional clínico.'),\nmk(1,'Introspección','La introspección consiste en:','Que las personas describan lo que experimentan en su propia mente',['Observar la conducta externa','Medir la actividad cerebral','Analizar los sueños de otros'],'Fue el método del estructuralismo.'),\nmk(1,'Perspectivas: neurociencia','La perspectiva de la neurociencia explica el comportamiento a partir de:','Procesos biológicos del cuerpo, como el cerebro y el sistema nervioso',['Fuerzas inconscientes','Pensamientos y recuerdos únicamente','El libre albedrío'],'Se describe como «sangre, sudor y miedos».'),\nmk(1,'Perspectivas: cognitiva','La perspectiva cognitiva se interesa por:','Cómo las personas piensan, comprenden y conciben el mundo',['Solo la conducta observable','Los impulsos de la infancia','La búsqueda de la autorrealización'],'Se centra en los procesos mentales.'),\nmk(1,'Perspectivas: psicodinámica','Sigmund Freud se asocia con la perspectiva:','Psicodinámica',['Conductual','Humanista','Cognitiva'],'Pone atención en la «persona interna» y el inconsciente.'),\nmk(1,'Controversias: determinismo','El determinismo sostiene que:','Factores fuera de nuestro control determinan nuestras acciones',['Podemos elegir libremente todos nuestros actos','La conducta no tiene causas','Solo importa el ambiente actual'],'Es el polo opuesto del libre albedrío.'),\nmk(1,'Controversias: consciente-inconsciente','¿Qué plantea la controversia «consciente vs. inconsciente»?','Si la conducta se explica por procesos que conocemos o por fuerzas de las que no nos damos cuenta',['Si los animales piensan','Si la herencia pesa más que el ambiente','Si las personas cambian con la edad'],'Se vincula con la perspectiva psicodinámica.'),\nmk(1,'Perspectivas: varias miradas','¿Por qué hay varias perspectivas en la psicología contemporánea?','Porque cada una explica el mismo comportamiento desde un ángulo distinto',['Porque solo una es correcta','Porque se contradicen sin utilidad','Porque cada una estudia un animal distinto'],'Por eso la guía invita a comparar cómo cada una explicaría una misma conducta.'),\nmk(1,'Controversias: estabilidad-cambio','La controversia «estabilidad vs. cambio» se pregunta si:','Las personas permanecen iguales o cambian a lo largo de la vida',['La conducta es heredada o aprendida','El inconsciente existe','Somos libres o determinados'],'Se relaciona con el desarrollo y la personalidad.'),\nmk(2,'Método científico','¿Cuál es el primer paso del método científico?','Identificar preguntas de interés',['Comunicar los resultados','Llevar a cabo la investigación','Replicar el estudio'],'Luego se formulan explicaciones, se investiga y se comunican los resultados.'),\nmk(2,'Definición operacional','Una definición operacional:','Traduce la hipótesis a procedimientos concretos que pueden medirse o manipularse',['Resume la teoría','Describe a los participantes','Interpreta los resultados'],'Hace comprobable la hipótesis.'),\nmk(2,'Métodos descriptivos: estudio de caso','Un estudio de caso consiste en:','Investigar a fondo a una persona o un grupo pequeño',['Preguntar a una muestra grande','Examinar registros existentes','Asignar al azar a dos grupos'],'Aporta profundidad, pero es difícil generalizar.'),\nmk(2,'Métodos descriptivos: documental','La investigación documental consiste en:','Examinar registros existentes para poner a prueba una hipótesis',['Observar en el ambiente real','Preguntar directamente a las personas','Manipular una variable'],'Su riesgo: pueden no existir datos o ser inútiles.'),\nmk(2,'Experimentos: variable dependiente','La variable dependiente es la que:','Se mide como resultado',['Manipula el experimentador','Se mantiene fuera del estudio','Define al grupo control'],'Depende de lo que haga el participante.'),\nmk(2,'Experimentos: grupos','El grupo experimental es el que:','Recibe el tratamiento',['No recibe ningún tratamiento','Se elige por conveniencia','Solo observa'],'El grupo de control sirve de comparación.'),\nmk(2,'Réplica y significancia','Repetir una investigación para comprobar sus hallazgos se llama:','Réplica',['Hipótesis','Tratamiento','Asignación aleatoria'],'Da confianza en que el resultado no fue casual.'),\nmk(2,'Investigación correlacional','La investigación correlacional busca:','Saber si dos variables se relacionan',['Probar que una causa a la otra','Describir un solo caso','Manipular una variable'],'Por eso no establece causalidad.'),\nmk(3,'Ética: privacidad','El derecho a la privacidad implica que:','Se protege la información sobre la conducta de los participantes',['Se publican sus nombres','Se obliga a participar','Se oculta el objetivo siempre'],'Es una de las pautas éticas básicas junto con evitar el daño y la voluntariedad.'),\nmk(3,'Sesgo experimental','Un ejemplo de sesgo experimental es que:','Las expectativas del investigador o de los participantes influyan en los resultados',['El estudio tenga un grupo control','Los participantes firmen consentimiento','La muestra sea grande'],'Amenaza la validez del experimento.'),\nmk(3,'Consentimiento informado','Antes de participar, el consentimiento informado exige conocer:','Los riesgos que puede haber',['Los resultados antes de que ocurran','La identidad de los demás participantes','El pago exacto'],'También el procedimiento y el derecho a retirarse.'),\nmk(3,'Diversidad de participantes','¿Cuál es el problema de estudiar solo a un grupo, por ejemplo estudiantes universitarios?','Los resultados podrían no aplicarse a otros grupos',['Se necesita más tiempo','No se puede replicar','Se rompe la privacidad'],'Por eso se buscan muestras representativas.'),\nmk(3,'Placebo','Un placebo es:','Un tratamiento sin efecto activo que se usa como comparación',['Un medicamento más fuerte','Un grupo experimental','Una variable independiente'],'Ayuda a controlar el sesgo experimental.'),\nmk(3,'Consumidor informado','Ser un consumidor informado de la psicología implica:','Pensar críticamente sobre la investigación',['Aceptar todo estudio publicado','Confiar solo en la intuición','Ignorar la muestra utilizada'],'Por ejemplo, preguntarse quién investigó y con qué método.')\n);\nlet QZ=QB.slice(0,15);\nconst ALERTS=[\n['Debe poder definir la psicología y explicar por qué incluye tanto el comportamiento como los procesos mentales.','Asocie cada subcampo con la pregunta que responde: cerebro (neurociencia conductual), percepción y pensamiento (experimental y cognitiva), cambio y estabilidad (desarrollo y personalidad), salud (salud, clínica y orientación) y relaciones (social e intercultural).','Distinga psicología clínica de orientación psicológica y recuerde los tres roles del psicólogo: maestro, científico y profesional clínico.'],\n['Ubique cada escuela y perspectiva con su idea central y su figura: estructuralismo, funcionalismo, Gestalt y las cinco perspectivas actuales.','Practique explicar una misma conducta desde cada una de las cinco perspectivas; es la forma más común de evaluarlas.','Domine las controversias (naturaleza-crianza, libre albedrío-determinismo, consciente-inconsciente, observable-interno, estabilidad-cambio) y por qué casi nunca hay una sola respuesta.'],\n['Debe poder ordenar los pasos del método científico y distinguir teoría, hipótesis y definición operacional.','Para cada método de investigación recuerde qué hace, un ejemplo y su principal debilidad.','Solo el experimento establece causa y efecto: identifique variable independiente, variable dependiente, grupo experimental, grupo de control y asignación aleatoria en un ejemplo nuevo.'],\n['Memorice los principios éticos básicos y qué incluye el consentimiento informado.','Explique por qué importan la diversidad de los participantes y el sesgo experimental, y cómo ayuda el placebo.','Prepárese para argumentar a favor y en contra del uso de animales en la investigación.'],\n['Debe poder trazar el recorrido de un mensaje nervioso: dendritas, cuerpo celular, axón y sinapsis.','Distinga lo eléctrico (dentro de la neurona: potencial de acción, todo o nada) de lo químico (entre neuronas: neurotransmisores).','Diferencie neurotransmisores excitatorios e inhibitorios y recuerde la función de las endorfinas.'],\n['Sepa dibujar el esquema del sistema nervioso de lo general a lo particular: central y periférico; somático y autónomo; simpático y parasimpático.','Relacione la división simpática con las emergencias y la parasimpática con el regreso a la calma; es una pregunta frecuente.','Distinga la comunicación nerviosa (por neuronas) de la endocrina (por hormonas en la sangre) y el papel de la pituitaria y el hipotálamo.'],\n['Memorice las estructuras del núcleo central y la función de cada una.','Ubique las funciones de la corteza (motora, sensorial, de asociación) y del sistema límbico.','Comprenda que los hemisferios se especializan pero trabajan juntos, y conozca las cuatro técnicas de exploración cerebral.'],\n['Distinga sensación (activación del órgano sensorial) de percepción (interpretación del estímulo).','Defina umbral absoluto y umbral diferencial, y explique qué es el ruido.','Aplique la ley de Weber: el cambio necesario para notar una diferencia es proporcional al estímulo inicial. Entienda la adaptación sensorial.'],\n['Debe poder ordenar el recorrido de la luz desde la córnea hasta el nervio óptico.','Diferencie la función de los conos (color) y de los bastones.','Compare la teoría tricromática y la del proceso oponente: ambas ayudan a explicar la visión del color.'],\n['Ordene el recorrido del sonido: oreja, tímpano, huesecillos, cóclea y nervio.','Compare la teoría del lugar y la de la frecuencia de la audición.','Conozca el olfato, el gusto y los sentidos cutáneos, y use la teoría de la compuerta para explicar el dolor.'],\n['Aplique las leyes gestálticas a ejemplos nuevos: cierre, proximidad, semejanza y simplicidad.','Distinga el procesamiento ascendente (parte del estímulo) del descendente (parte del conocimiento y las expectativas).','Explique cómo vemos en tres dimensiones, qué es la constancia perceptual y por qué ocurren las ilusiones visuales.'],\n['Distinga las etapas del sueño y qué ocurre durante el sueño MOR.','Compare las tres explicaciones de los sueños con su perspectiva: cumplimiento de deseos (Freud), supervivencia y activación-síntesis.','Reconozca cada trastorno del sueño por su descripción: insomnio, apnea, narcolepsia, somniloquía y sonambulismo.'],\n['Defina hipnosis y meditación y explique en qué se diferencian.','Prepárese para discutir si la hipnosis es o no un estado de conciencia diferente.','Recuerde que la cultura influye en las maneras de alterar la conciencia.'],\n['Clasifique cada droga en su categoría: estimulantes, depresores, narcóticos o alucinógenos.','Conozca los efectos y riesgos principales de cada categoría, incluida la dependencia.','Reconozca las señales de abuso y la importancia de buscar ayuda profesional.'],\n['Identifique estímulo neutro, EI, RI, EC y RC en un ejemplo nuevo; es el error más común.','Distinga extinción, recuperación espontánea, generalización y discriminación del estímulo.','Explique el orden del proceso: el estímulo neutro se presenta justo antes del estímulo incondicionado.'],\n['Distinga reforzamiento positivo, reforzamiento negativo, castigo positivo y castigo negativo: pregunte si se agrega o se quita algo y si la conducta sube o baja.','Diferencie reforzadores primarios y secundarios.','Compare los programas de reforzamiento (razón e intervalo, fijos y variables), recuerde que el parcial produce un aprendizaje más duradero y entienda el moldeamiento.'],\n['Explique en qué se diferencia el aprendizaje cognitivo (latente, mapas cognitivos) del condicionamiento clásico y operante.','En el aprendizaje por observación, recuerde que se imita más al modelo que es recompensado.','Relacione la observación de violencia con la conducta agresiva y distinga los estilos de aprendizaje.'],\n['Ordene los tres almacenes (sensorial, corto plazo, largo plazo) con su capacidad y duración.','Diferencie memoria declarativa (episódica y semántica) de procedimental, y entienda la memoria de trabajo.','Ubique el hipocampo y la amígdala, y comprenda que los recuerdos se distribuyen por todo el cerebro.'],\n['Diferencie recordar de reconocer, y memoria explícita de implícita.','Explique por qué la memoria es constructiva y cómo los esquemas sesgan lo que recordamos.','Conozca los errores del testigo ocular y por qué el procesamiento profundo mejora el recuerdo.'],\n['Distinga decaimiento, interferencia (proactiva y retroactiva) y olvido dependiente de claves.','Diferencie amnesia retrógrada d
