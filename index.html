gación sobre memoria, pensamiento y lenguaje.','Se opone al determinismo: la persona puede elegir.'],\n['Una buena teoría genera hipótesis que se pueden comprobar.','Si no se puede medir u observar, no es comprobable: por eso se define operacionalmente.','Útil cuando ya existen registros; su límite es la calidad de los datos.','Observe sin que se note: lo ideal es que el sujeto no cambie su conducta.','El tamaño y la representatividad de la muestra importan.','Aporta profundidad pero poca capacidad de generalización.','Una relación fuerte no prueba causa; puede haber una tercera variable.','Es el único método que controla variables y permite hablar de causa y efecto.'],\n['Piense en tres palabras: daño, privacidad, voluntad.','La privacidad protege lo que el participante hace y dice en el estudio.','Voluntario significa también poder salir en cualquier momento.','Procedimiento + riesgos + derecho a retirarse.','Un estudio con un solo grupo social no representa a todos.','Debate abierto: valorar beneficios científicos frente al daño a los animales.','El placebo permite separar el efecto real del efecto de la expectativa.']\n];\nDATA.push({n:5,name:'Neuronas: elementos básicos del comportamiento',center:'Neuronas y comunicación nerviosa',branches:[\n['Neurocientíficos conductuales','Psicólogos (biopsicólogos) que estudian los efectos de las estructuras y funciones biológicas en el comportamiento, en particular las del sistema nervioso.','Ejemplo: relacionar un circuito nervioso con una conducta o una emoción.'],\n['La neurona','Elemento más básico del sistema nervioso; transmite impulsos nerviosos de una parte a otra del cuerpo.','Partes: dendritas, cuerpo celular, axón y botones terminales.'],\n['Ruta de la información','La información en una neurona sigue una ruta que comienza en las dendritas, continúa en el cuerpo celular y desciende por el axón. La mayor parte de los axones está aislada por la vaina de mielina.','Las dendritas detectan mensajes; los axones transmiten señales que se alejan de la neurona.'],\n['Potencial de acción','Carga eléctrica que viaja por el axón cuando la neurona recibe el mensaje de dispararse. Las neuronas operan según la ley de todo o nada.','Están en reposo o el potencial de acción se mueve por ellas: no hay estado intermedio.'],\n['Sinapsis y neurotransmisores','Los neurotransmisores son sustancias químicas que salvan las brechas, llamadas sinapsis, entre las neuronas. Luego ocurre la recaptación.','Dentro de la neurona el mensaje es eléctrico; entre neuronas es químico.'],\n['Excitatorios e inhibitorios','Los mensajes excitatorios indican a otras neuronas que se activen; los inhibitorios impiden o disminuyen la probabilidad de que otras neuronas se activen.','Son dos tipos de efecto de un neurotransmisor.'],\n['Endorfinas y neuronas espejo','Las endorfinas son neurotransmisores relacionados con la reducción del dolor: un analgésico natural, probablemente responsable de la euforia de los corredores. Las neuronas espejo se activan al realizar una acción y al ver a otro realizarla.','Ejemplo: la euforia después de correr.']],\nmn:{title:'Don Carlos Atiende Siempre: la ruta de la información en la neurona',tiles:[['D','Dendritas','Detectan mensajes de otras neuronas'],['C','Cuerpo celular','Recibe e integra el mensaje'],['A','Axón','Transmite la señal que se aleja de la neurona'],['S','Sinapsis','Brecha química hacia la siguiente neurona']],tip:'Dentro de la neurona el mensaje es eléctrico; entre neuronas es químico.'},\ncards:[['Neurona','¿Qué hacen las dendritas y el axón?','Las dendritas detectan mensajes de otras neuronas; el axón transmite señales que se alejan de la neurona.'],['Ley','¿Qué dice la ley de todo o nada?','Una neurona está en reposo o dispara el potencial de acción; no hay estado intermedio.'],['Comunicación','¿Cómo viaja el mensaje dentro y entre neuronas?','Dentro de la neurona, en forma eléctrica; entre neuronas, por medios químicos (neurotransmisores en la sinapsis).']]});\nSUM.push({points:['Comprender el comportamiento exige conocer sus influencias biológicas, en particular las del sistema nervioso.','La neurona recibe mensajes por las dendritas, los procesa en el cuerpo celular y los envía por el axón, aislado en su mayoría por la vaina de mielina.','El potencial de acción es una carga eléctrica que obedece la ley de todo o nada.','Los neurotransmisores cruzan la sinapsis y pueden ser excitatorios o inhibitorios.','Las endorfinas reducen el dolor; las neuronas espejo se activan al hacer y al observar una acción.'],tips:['Alerta de estudio: dendritas detectan; axones transmiten hacia afuera.','Hecho esencial: eléctrico dentro de la neurona, químico entre neuronas.','Dibuje una neurona y rotule sus partes en el orden en que viaja el mensaje.']});\nEXTRA.push([['Sinapsis','¿Qué es la sinapsis?','La brecha entre neuronas que los neurotransmisores atraviesan.'],['Mielina','¿Para qué sirve la vaina de mielina?','Aísla la mayor parte de los axones.'],['Neurotransmisores','Excitatorios vs. inhibitorios','Excitatorios: indican a otras neuronas que se activen. Inhibitorios: impiden o disminuyen la probabilidad de que se activen.'],['Endorfinas','¿Qué son las endorfinas?','Neurotransmisores relacionados con la reducción del dolor; un analgésico natural.'],['Término','¿Qué es la recaptación?','El proceso por el cual el neurotransmisor sobrante vuelve a ser absorbido tras la transmisión.'],['Profesión','¿Quiénes son los neurocientíficos conductuales?','Psicólogos que estudian los efectos de las estructuras y funciones biológicas en el comportamiento.']]);\nMORE.push(['Es el nombre técnico de quienes estudian la base biológica del comportamiento.','Cuatro partes que debe poder rotular: dendritas, cuerpo celular, axón y botones terminales.','Siga el camino: dendritas, cuerpo celular, axón.','Todo o nada: como un interruptor, o dispara o no dispara.','El neurotransmisor es el puente químico entre dos neuronas.','Excitatorio = activa; inhibitorio = frena.','Endorfinas: dolor menos; espejo: imitar y comprender acciones.']);\nDATA.push({n:6,name:'El sistema nervioso y el sistema endocrino',center:'Sistemas nervioso y endocrino',branches:[\n['Sistema nervioso central (SNC)','Está formado por el cerebro y la médula espinal.','La médula espinal conduce mensajes y participa en los reflejos.'],\n['Tipos de neuronas','Las neuronas sensoriales (aferentes) llevan información al SNC; las motoras (eferentes) llevan órdenes desde el SNC; las interneuronas conectan unas con otras.','Un reflejo es una respuesta automática e involuntaria ante un estímulo.'],\n['Sistema nervioso periférico','Se divide en la división somática, que controla los movimientos voluntarios y la comunicación hacia y desde los órganos sensoriales, y la división autónoma, que controla funciones involuntarias como las del corazón, los vasos sanguíneos y los pulmones.','Somática = voluntaria; autónoma = involuntaria.'],\n['Simpática y parasimpática','La división simpática prepara al cuerpo para las situaciones de emergencia; la parasimpática ayuda al cuerpo a regresar a su estado de reposo común.','Ambas son subdivisiones de la división autónoma.'],\n['Psicología evolutiva y genética conductual','La psicología evolutiva busca pautas de comportamiento que son resultado de nuestra herencia genética y ayuda a entender la estructura y organización del sistema nervioso humano.','La genética conductual estudia la herencia de los rasgos de conducta.'],\n['Sistema endocrino','Secreta hormonas, sustancias químicas que regulan el funcionamiento del cuerpo por medio del torrente sanguíneo. La glándula pituitaria secreta las hormonas del crecimiento e influye en otras glándulas; el hipotálamo la regula.','Las hormonas circulan por la sangre, a diferencia de los neurotransmisores.']],\nmn:{title:'Simpática = Salir corriendo; Parasimpática = Pausa',tiles:[['S','Simpática','Prepara al cuerpo para emergencias'],['P','Parasimpática','Regresa al cuerpo al reposo'],['S','Somática','Movimientos voluntarios'],['A','Autónoma','Funciones automáticas e involuntarias']],tip:'SNC = cerebro + médula espinal. Todo lo demás es sistema nervioso periférico.'},\ncards:[['Estructura','¿De qué se compone el SNC?','Del cerebro y la médula espinal.'],['Contraste','División simpática vs. parasimpática','La simpática prepara al cuerpo para emergencias; la parasimpática lo regresa al reposo.'],['Endocrino','¿Qué hace el sistema endocrino?','Secreta hormonas que regulan el funcionamiento del cuerpo por el torrente sanguíneo.']]});\nSUM.push({points:['El sistema nervioso se divide en sistema nervioso central (cerebro y médula espinal) y periférico.','El periférico incluye la división somática (voluntaria) y la autónoma (involuntaria).','La autónoma se subdivide en simpática (emergencias) y parasimpática (regreso al reposo).','La psicología evolutiva ayuda a entender la estructura y organización del sistema nervioso humano.','El sistema endocrino regula el cuerpo con hormonas; la pituitaria es regulada por el hipotálamo.'],tips:['Hormonas = sustancias químicas que circulan por la sangre.','Haga un diagrama de árbol del sistema nervioso de lo general a lo particular.']});\nEXTRA.push([['Neuronas','Sensoriales vs. motoras','Sensoriales (aferentes): llevan información al SNC. Motoras (eferentes): llevan órdenes desde el SNC.'],['Periférico','¿Qué controla la división somática?','Los movimientos voluntarios y la comunicación de información hacia y desde los órganos sensoriales.'],['Autónoma','¿Qué controla la división autónoma?','Funciones involuntarias como las del corazón, los vasos sanguíneos y los pulmones.'],['Glándula','¿Qué hace la glándula pituitaria?','Secreta las hormonas del crecimiento e influye en otras glándulas endocrinas; la regula el hipotálamo.'],['Término','¿Qué es un reflejo?','Una respuesta automática e involuntaria ante un estímulo.'],['Evolutiva','¿Qué aporta la psicología evolutiva?','Identifica pautas de comportamiento resultado de la herencia genética y ayuda a entender el sistema nervioso.']]);\nMORE.push(['Piense en la autopista central: cerebro y médula.','Sensorial entra, motora sale, interneurona conecta.','Somática = yo decido; autónoma = automática.','Simpática acelera; parasimpática calma.','Evolución explica por qué el sistema nervioso está organizado así.','La pituitaria es la glándula «maestra» regulada por el hipotálamo.']);\nDATA.push({n:7,name:'El cerebro',center:'El cerebro y sus partes',branches:[\n['Exploraciones cerebrales','Toman una «fotografía» del funcionamiento interno del cerebro sin cortar el cráneo. Principales técnicas: EEG, TEP, IRMf y EMT.','Difieren en la manera en que producen imágenes del cerebro.'],\n['Núcleo central','Es el «cerebro primitivo». Médula: respiración y ritmo cardiaco. Puente: coordina músculos y ambos lados del cuerpo. Cerebelo: equilibrio. Formación reticular: acentúa la conciencia en emergencias. Tálamo: comunica mensajes sensoriales. Hipotálamo: homeostasis y conductas de supervivencia.','Sus funciones son similares a las de otros vertebrados.'],\n['Corteza cerebral','El «nuevo cerebro»: el área motora controla el movimiento voluntario, el área sensorial los sentidos y las áreas de asociación el pensamiento, el razonamiento, el habla y la memoria.','Tiene lóbulos.'],\n['Sistema límbico','Se halla en el límite entre los cerebros «primitivo» y «nuevo»; se asocia con la alimentación, la agresión, la reproducción y las experiencias de placer y dolor.','Está entre el núcleo central y la corteza.'],\n['Los dos hemisferios','Cada hemisferio controla generalmente el lado opuesto del cuerpo. El izquierdo se especializa en tareas verbales (razonamiento lógico, habla, lectura); el derecho en tareas no verbales (percepción espacial, reconocimiento de pautas, expresión emocional).','Trabajan en forma interdependiente: la especialización no es grande.'],\n['Neuroplasticidad y neurogénesis','El sistema nervioso puede reorganizarse (neuroplasticidad) y generar nuevas neuronas (neurogénesis), lo que abre posibilidades para tratar daños.','Concepto relacionado con la recuperación tras lesiones.'],\n['Aliviar enfermedades y dolor','La comprensión del sistema nervioso ayuda a hallar formas de aliviar enfermedades y dolor; entre ellas, la biorrealimentación, técnica para aprender a controlar respuestas involuntarias.','RA 7-4.']],\nmn:{title:'Mi Padre Camina Rápido, Tropieza Hoy: el núcleo central',tiles:[['M','Médula','Respiración y ritmo cardiaco'],['P','Puente','Coordina músculos y ambos lados del cuerpo'],['C','Cerebelo','Equilibrio'],['R','Reticular','Acentúa la conciencia en emergencias'],['T','Tálamo','Comunica mensajes sensoriales'],['H','Hipotálamo','Homeostasis y supervivencia']],tip:'Corteza: motora = movimiento; sensorial = sentidos; asociación = pensar, hablar y recordar. Hemisferio izquierdo: verbal; derecho: no verbal.'},\ncards:[['Técnicas','¿Qué técnicas exploran el cerebro?','EEG, TEP, IRMf y EMT: toman una «fotografía» del funcionamiento sin abrir el cráneo.'],['Estructura','¿Qué controla el cerebelo?','El equilibrio.'],['Hemisferios','Hemisferio izquierdo vs. derecho','Izquierdo: tareas verbales (razonamiento lógico, habla, lectura). Derecho: tareas no verbales (percepción espacial, reconocimiento de pautas, expresión emocional).']]});\nSUM.push({points:['Las exploraciones cerebrales (EEG, TEP, IRMf, EMT) muestran el cerebro en funcionamiento sin cirugía.','El núcleo central («cerebro primitivo») incluye médula, puente, cerebelo, formación reticular, tálamo e hipotálamo.','La corteza cerebral tiene áreas motora, sensorial y de asociación.','El sistema límbico se asocia con alimentación, agresión, reproducción, placer y dolor.','Cada hemisferio controla el lado opuesto del cuerpo y se especializa, pero ambos trabajan en forma interdependiente.'],tips:['Alerta de estudio: la EEG, la IRMf, la TEP y la EMT difieren en la manera en que producen imágenes.','La especialización de los hemisferios no es grande: no hay «cerebro derecho» y «cerebro izquierdo» aislados.','Memorice el núcleo central de abajo hacia arriba con la frase mnemotécnica.']});\nEXTRA.push([['Núcleo','¿Qué hace el hipotálamo?','Mantiene la homeostasis o equilibrio corporal y regula conductas relacionadas con la supervivencia básica.'],['Núcleo','¿Qué hace el tálamo?','Comunica los mensajes sensoriales desde y hacia el cerebro.'],['Corteza','Áreas motora, sensorial y de asociación','Motora: movimiento voluntario. Sensorial: sentidos. Asociación: pensamiento, razonamiento, habla y memoria.'],['Límbico','¿Con qué se asocia el sistema límbico?','Con la alimentación, la agresión, la reproducción y las experiencias de placer y dolor.'],['Término','¿Qué es la lateralización?','La especialización de cada hemisferio en ciertas funciones.'],['Término','¿Qué es la neuroplasticidad?','La capacidad del sistema nervioso de reorganizarse.']]);\nMORE.push(['Cuatro técnicas: EEG, TEP, IRMf, EMT.','Núcleo central = funciones básicas de supervivencia, similar al de otros vertebrados.','Corteza = nuevo cerebro: lo voluntario y lo superior.','Límbico = emociones y motivos básicos.','Un hemisferio controla el lado opuesto del cuerpo.','El cerebro puede reorganizarse tras daños.','Entender el sistema nervioso permite diseñar tratamientos.']);\nDATA.push({n:8,name:'Sensación y umbrales',center:'Sensación',branches:[\n['Sensación','Es la activación de los órganos sensoriales por parte de cualquier fuente de energía física.','Es una respuesta física.'],\n['Percepción','Es el proceso por el cual clasificamos, interpretamos, analizamos e integramos los estímulos a los que están expuestos nuestros sentidos.','Es una respuesta psicológica.'],\n['Psicofísica','Estudia la relación entre la naturaleza física de los estímulos y las respuestas sensoriales que provocan.','Mide qué tan sensibles somos a los estímulos.'],\n['Umbral absoluto','Es la menor cantidad de intensidad física a la que puede detectarse un estímulo. En condiciones ideales es extraordinariamente sensible.','Se ve afectado por el ruido.'],\n['Ruido','Estímulos de fondo que interfieren con otros estímulos y reducen la capacidad de detección.','No solo es sonido: cualquier estímulo de fondo.'],\n['Umbral diferencial','También llamado diferencia apenas perceptible: es el menor cambio en el nivel de estimulación necesario para percibir que ha ocurrido un cambio.','Se rige por la ley de Weber.'],\n['Ley de Weber','Una diferencia apenas perceptible está en proporción constante de la intensidad del estímulo inicial.','Se aplica a cualquier estímulo sensorial: visión, sonido, gusto, etcétera.'],\n['Adaptación sensorial','Ocurre cuando nos acostumbramos a un estímulo constante y cambiamos nuestra evaluación de este.','La exposición repetida genera una aparente disminución en la sensibilidad.']],\nmn:{title:'Siempre Pienso Ubicar Diferencias Aparentes',tiles:[['S','Sensación','Activación de los órganos sensoriales'],['P','Percepción','Interpretación de los estímulos'],['U','Umbral absoluto','Intensidad mínima detectable'],['D','Diferencial','Cambio mínimo que se nota'],['A','Adaptación','Nos acostumbramos al estímulo constante']],tip:'Sensación = sentir (física); percepción = pensar sobre lo sentido (psicológica).'},\ncards:[['Contraste','Sensación vs. percepción','Sensación: activación de los órganos sensoriales (respuesta física). Percepción: interpretación de los estímulos (respuesta psicológica).'],['Umbral','¿Qué es el umbral absoluto?','La menor intensidad física a la que puede detectarse un estímulo.'],['Ley','¿Qué dice la ley de Weber?','Una diferencia apenas perceptible está en proporción constante de la intensidad del estímulo inicial.']]});\nSUM.push({points:['La sensación es la activación de los órganos sensoriales; la percepción es la interpretación de esos estímulos.','La psicofísica estudia la relación entre estímulos físicos y respuestas sensoriales.','El umbral absoluto es la menor intensidad detectable; el ruido reduce esa capacidad.','El umbral diferencial es el menor cambio perceptible y cumple la ley de Weber.','La adaptación sensorial disminuye la sensibilidad ante un estímulo constante.'],tips:['Alerta de estudio: sensación = respuesta física; percepción = respuesta psicológica.','La ley de Weber se aplica a cualquier sentido.','Ejemplo propio: piense cuánto tarda en dejar de notar el ruido de un ventilador (adaptación).']});\nEXTRA.push([['Término','¿Qué es el ruido en psicofísica?','Estímulos de fondo que interfieren con otros estímulos.'],['Umbral','¿Qué es el umbral diferencial?','El menor cambio en el nivel de estimulación necesario para percibir que hubo un cambio.'],['Adaptación','¿Qué es la adaptación sensorial?','Acostumbrarse a un estímulo constante y reducir la sensibilidad a este.'],['Psicofísica','¿Qué estudia la psicofísica?','La relación entre la naturaleza física de los estímulos y las respuestas sensoriales.'],['Definición','¿Qué es un estímulo?','Cualquier fuente de energía física que activa un órgano sensorial.'],['Weber','Si la ley de Weber se cumple, ¿qué ocurre al aumentar el estímulo inicial?','Hace falta un cambio mayor para notar la diferencia, en proporción constante.']]);\nMORE.push(['Sentir ocurre en el órgano sensorial.','Percibir ocurre cuando el cerebro da sentido.','Piense en medir sensibilidad con experimentos.','Condiciones ideales: umbrales muy sensibles.','El ruido empeora la detección.','Diferencia apenas perceptible = DAP.','Proporción constante con el estímulo inicial.','Estímulo constante: dejamos de notarlo.']);\nDATA.push({n:9,name:'La vista',center:'El sentido de la vista',branches:[\n['La luz','Ondas electromagnéticas en la parte visible del espectro que se reflejan de los objetos o se producen por una fuente de energía.','La vista depende de la sensibilidad a la luz.'],\n['Llegar a la retina','La luz entra en el ojo, atraviesa la córnea, la pupila y el cristalino y llega a la retina.','El ojo da forma a la luz en una imagen.'],\n['Retina','Allí la energía electromagnética de la luz se convierte en impulsos nerviosos para su transmisión al cerebro.','Contiene conos y bastones.'],\n['Conos y bastones','Reúnen la información visual; los conos se relacionan con la visión cromática.','La información pasa por las células bipolares y ganglionares.'],\n['Del ojo al cerebro','Los impulsos salen del ojo por el nervio óptico, que conduce al quiasma óptico, el punto donde se divide el nervio óptico.','Luego se procesa el mensaje visual (detección de rasgos).'],\n['Teoría tricromática','Hay tres tipos de conos en la retina, cada uno sensible a cierto rango de colores.','Explica la visión cromática en la retina.'],\n['Teoría del proceso oponente','Hay pares de diferentes tipos de células en el ojo que trabajan en oposición unas con otras.','Complementa a la teoría tricromática.']],\nmn:{title:'Cada Persona Capta Rayos Nítidos: el camino de la luz',tiles:[['C','Córnea','La luz entra por aquí'],['P','Pupila','Regula la entrada de luz'],['C','Cristalino','Enfoca la luz'],['R','Retina','Convierte la luz en impulsos nerviosos'],['N','Nervio óptico','Lleva los impulsos al cerebro']],tip:'Dos teorías de la visión cromática: tricromática (tres tipos de conos) y proceso oponente (pares de células).'},\ncards:[['Camino','¿Por dónde pasa la luz hasta la retina?','Por la córnea, la pupila y el cristalino.'],['Retina','¿Qué ocurre en la retina?','La energía electromagnética de la luz se convierte en impulsos nerviosos.'],['Color','Teoría tricromática vs. proceso oponente','Tricromática: tres tipos de conos sensibles a rangos de colores. Proceso oponente: pares de células que trabajan en oposición.']]});\nSUM.push({points:['La vista depende de la luz, ondas electromagnéticas visibles.','La luz atraviesa la córnea, la pupila y el cristalino hasta la retina.','En la retina se convierte en impulsos nerviosos que salen por el nervio óptico.','Los conos y bastones transfieren la información por células bipolares y ganglionares hasta el quiasma óptico.','La visión cromática se explica con las teorías tricromática y del proceso oponente.'],tips:['Alerta de estudio: los conos se relacionan con la visión cromática.','Hay dos explicaciones para el color: aprenda ambas.','Rotule un esquema del ojo con el recorrido de la luz.']});\nEXTRA.push([['Células','¿Qué cubre el recorrido ganglionar?','La información reunida por bastones y conos se transfiere por las células ganglionares y bipolares al nervio óptico.'],['Estructura','¿Qué es el quiasma óptico?','El punto donde se divide el nervio óptico.'],['Conos','¿Con qué se relacionan los conos?','Con la visión cromática.'],['Luz','¿Qué es la luz?','Ondas electromagnéticas en la parte visible del espectro.'],['Término','¿Qué es la detección de rasgos?','Parte del procesamiento del mensaje visual en el cerebro.'],['Retina','¿Qué es el nervio óptico?','La vía por la que salen del ojo los impulsos nerviosos.']]);\nMORE.push(['Sin luz no hay visión.','Recorrido: córnea, pupila, cristalino, retina.','La retina es el «traductor» de luz a impulsos.','Bastones y conos: dos tipos de receptores.','Nervio óptico → quiasma óptico.','Tres tipos de conos, sensibles a rangos de color.','Pares de células en oposición.']);\nDATA.push({n:10,name:'El oído y otros sentidos',center:'Oído, olfato, gusto y piel',branches:[\n['Aspectos físicos del sonido','El sonido es una onda de aire vibrante. Tiene características físicas como la frecuencia y la amplitud.','Las teorías del lugar y de la frecuencia explican cómo distinguimos frecuencias e intensidades.'],\n['Recorrido del sonido','Entra por la oreja, viaja por el canal auditivo hasta el tímpano; en el oído medio los huesecillos (martillo, yunque y estribo) lo transmiten a la ventana oval.','Las vibraciones llegan luego al oído interno.'],\n['Oído interno','Las vibraciones se desplazan por la cóclea, que encierra a la membrana basilar; las células pilosas transforman la energía mecánica en impulsos nerviosos que van al cerebro.','También participa en el equilibrio (canales semicirculares) y el movimiento.'],\n['Olfato','Depende de las células olfatorias, receptores en la nariz.','Es uno de los sentidos químicos.'],\n['Gusto','Se centra en las papilas gustativas de la lengua.','El olfato y el gusto trabajan juntos.'],\n['Sentidos cutáneos','Son responsables de las experiencias del tacto, la presión, la temperatura y el dolor.','Hay varios sentidos cutáneos.'],\n['Dolor','La teoría de la compuerta señala que ciertos receptores nerviosos abren una «compuerta» a áreas del cerebro relacionadas con el dolor y otro conjunto la cierra. Se alivia con medicación, hipnosis, biorretroalimentación, relajación, cirugía, estimulación nerviosa y cerebral y terapia cognitiva.','RA 10-3.']],\nmn:{title:'Todos Mis Yoyos Eran Coloridos: la ruta del sonido',tiles:[['T','Tímpano','Recibe las vibraciones'],['M','Martillo','Primer huesecillo'],['Y','Yunque','Segundo huesecillo'],['E','Estribo','Tercer huesecillo, llega a la ventana oval'],['C','Cóclea','Con la membrana basilar y las células pilosas']],tip:'Teoría del lugar vs. teoría de la frecuencia: dos explicaciones de cómo distinguimos los sonidos.'},\ncards:[['Oído','¿Cuáles son los tres huesecillos del oído medio?','Martillo, yunque y estribo.'],['Dolor','¿Qué propone la teoría de la compuerta?','Que ciertos receptores abren una «compuerta» a áreas del cerebro relacionadas con el dolor y otro conjunto de receptores la cierra.'],['Sentidos','¿Qué sentidos cutáneos existen?','Tacto, presión, temperatura y dolor.']]});\nSUM.push({points:['El oído se encarga del sonido, el movimiento y el equilibrio.','El sonido viaja por canal auditivo, tímpano, huesecillos, ventana oval y cóclea.','Las células pilosas de la membrana basilar convierten las ondas en impulsos nerviosos.','El olfato depende de las células olfatorias; el gusto, de las papilas gustativas.','Los sentidos cutáneos son tacto, presión, temperatura y dolor; la teoría de la compuerta explica el dolor.'],tips:['Alerta de estudio: entienda las diferencias entre las teorías del lugar y de la frecuencia.','Hay varios sentidos cutáneos, no solo el tacto.','Repase el recorrido del sonido en orden.']});\nEXTRA.push([['Sonido','¿Qué características físicas tiene el sonido?','Frecuencia y amplitud, entre otras.'],['Equilibrio','¿Qué estructuras del oído participan en el equilibrio?','Los canales semicirculares.'],['Olfato','¿Qué son las células olfatorias?','Las células receptoras de la nariz.'],['Gusto','¿Dónde están las papilas gustativas?','En la lengua.'],['Teorías','Teoría del lugar vs. teoría de la frecuencia','Dos explicaciones de cómo distinguimos sonidos de diversas frecuencias e intensidades.'],['Dolor','Ejemplos de técnicas para aliviar el dolor','Medicación, hipnosis, biorretroalimentación, relajación, cirugía, estimulación nerviosa y cerebral, terapia cognitiva.']]);\nMORE.push(['Frecuencia = tono; amplitud = intensidad.','Tímpano → huesecillos → ventana oval → cóclea.','Cóclea y células pilosas: de vibración a impulso.','Receptores químicos en la nariz.','Papilas gustativas en la lengua.','Cuatro sentidos cutáneos.','El dolor tiene tratamientos médicos y psicológicos.']);\nDATA.push({n:11,name:'Percepción: organización del mundo',center:'Percepción',branches:[\n['Percepción constructiva','La percepción es un proceso constructivo: las personas van más allá de los estímulos físicamente presentes y tratan de construir una interpretación significativa.','Ejemplo: ver una figura completa a partir de fragmentos.'],\n['Leyes gestálticas','Describen cómo organizamos fragmentos de información en conjuntos significativos (gestalt) mediante el cierre, la proximidad, la semejanza y la simplicidad.','Ver módulo 2 para la escuela Gestalt.'],\n['Procesamiento descendente y ascendente','Descendente: la percepción se guía por conocimientos, experiencias, expectativas y motivaciones. Ascendente: se reconocen y procesan los componentes individuales hasta llegar a la percepción del conjunto.','Descendente = de las ideas a los datos; ascendente = de los datos a las ideas.'],\n['Percepción de la profundidad','Es la capacidad de percibir la distancia y ver en tres dimensiones aunque las imágenes en la retina sean de dos. Se usan la disparidad binocular y claves monoculares (paralaje de movimiento, tamaño relativo, perspectiva lineal).','RA 11-2.'],\n['Constancia perceptual','Permite percibir que el tamaño, la forma y el color de los estímulos se mantienen invariables a pesar de cambios en el ambiente o en la apariencia de los objetos.','Ejemplo: una puerta se ve rectangular aunque esté abierta.'],\n['Percepción del movimiento','Depende del movimiento percibido de un objeto a lo largo de la retina y de la información sobre cómo se mueven la cabeza y los ojos.','']\n,['Ilusiones visuales','Son estímulos físicos que producen consistentemente errores de percepción; se deben a errores en la interpretación del cerebro. Una de las más conocidas es la de Müller-Lyer. La cultura influye en la percepción.','']],\nmn:{title:'Cuatro Piezas Siempre Se unen: leyes gestálticas',tiles:[['C','Cierre','Completamos figuras incompletas'],['P','Proximidad','Agrupamos lo que está cerca'],['S','Semejanza','Agrupamos lo que se parece'],['S','Simplicidad','Preferimos la forma más simple']],tip:'Descendente = conocimiento y expectativas hacia el estímulo; ascendente = estímulo hacia el conjunto.'},\ncards:[['Gestalt','¿Cuáles son las leyes gestálticas?','Cierre, proximidad, semejanza y simplicidad.'],['Contraste','Procesamiento descendente vs. ascendente','Descendente: guiado por conocimientos, experiencias y expectativas. Ascendente: de los componentes individuales a la percepción del conjunto.'],['Ilusión','¿Qué es una ilusión visual?','Un estímulo físico que produce consistentemente errores de percepción.']]});\nSUM.push({points:['La percepción es constructiva: damos significado más allá del estímulo físico.','Las leyes gestálticas organizan la información: cierre, proximidad, semejanza y simplicidad.','El procesamiento puede ser descendente (conocimientos) o ascendente (componentes).','Vemos la profundidad con la disparidad binocular y claves monoculares.','Las ilusiones visuales, como la de Müller-Lyer, muestran errores sistemáticos del cerebro; la cultura también influye.'],tips:['La constancia perceptual mantiene estables tamaño, forma y color.','Compare un mismo estímulo viéndolo con procesamiento ascendente y descendente.']});\nEXTRA.push([['Profundidad','¿Qué es la disparidad binocular?','Una clave de profundidad que resulta de usar los dos ojos.'],['Profundidad','Ejemplos de claves monoculares','Paralaje de movimiento, tamaño relativo de las imágenes en la retina y perspectiva lineal.'],['Constancia','¿Qué es la constancia perceptual?','Percibir invariables el tamaño, la forma y el color pese a cambios en el ambiente o la apariencia.'],['Ilusión','¿Cuál es una ilusión conocida?','La de Müller-Lyer.'],['Gestalt','¿Qué es una gestalt?','Un conjunto significativo de información organizada.'],['Movimiento','¿De qué depende la percepción del movimiento?','Del movimiento del objeto en la retina y de la información sobre el movimiento de la cabeza y los ojos.']]);\nMORE.push(['Percibir es construir, no solo registrar.','Cierre, proximidad, semejanza, simplicidad.','Descendente usa lo que ya sabemos.','Del mundo 2D de la retina al 3D.','Un objeto no «cambia» al cambiar de ángulo.','Cabeza y ojos aportan información de movimiento.','Las ilusiones revelan cómo funciona la percepción.']);\nDATA.push({n:12,name:'Sueño y ensueños',center:'Estados de conciencia',branches:[\n['Conciencia','Es la noción de las sensaciones, pensamientos y sentimientos que experimentamos en un momento determinado. La conciencia de vigilia puede variar de un estado más activo a uno más pasivo.','Los estados alterados incluyen el sueño, la hipnosis y los estados inducidos por drogas.'],\n['Etapas del sueño','El cerebro está activo durante la noche y el sueño atraviesa una serie de etapas (1, 2, 3, 4 y MOR) con patrones únicos de ondas cerebrales.','Los ritmos circadianos regulan ciclos de unas 24 horas.'],\n['Sueño MOR','Se caracteriza por movimientos oculares rápidos y aumento del ritmo cardiaco, la presión sanguínea y el ritmo respiratorio. Las imágenes oníricas ocurren durante esta etapa.','Es la etapa de los sueños.'],\n['Freud: cumplimiento de deseos','Según Freud, los sueños tienen un contenido manifiesto (aparente guión) y un contenido latente (significado verdadero) que revela deseos insatisfechos.','Teoría del cumplimiento de deseos inconscientes.'],\n['Sueños para la supervivencia','Desde una perspectiva evolutiva, la información relevante para la supervivencia cotidiana se reconsidera y reprocesa en los sueños.','Teoría de los sueños para la supervivencia.'],\n['Activación y síntesis','Desde un enfoque neurocientífico, los sueños son el resultado de energía eléctrica aleatoria que estimula recuerdos que luego se integran en una trama coherente.','Teoría de la activación y la síntesis.'],\n['Trastornos del sueño','Insomnio: dificultades para dormir. Apnea del sueño: dificultad para dormir y respirar a la vez. Narcolepsia: necesidad incontrolable de dormir. Somniloquía y sonambulismo: relativamente inocuos.','RA 12-3.'],\n['Ensueños','Existen amplias diferencias individuales en el tiempo dedicado a los ensueños; casi todos tenemos fantasías en cierto grado.','RA 12-4.']],\nmn:{title:'Cuenta Sueños Alegres: tres explicaciones de los sueños',tiles:[['C','Cumplimiento de deseos','Freud: deseos inconscientes (contenido manifiesto y latente)'],['S','Supervivencia','Evolutiva: se reprocesa lo útil para sobrevivir'],['A','Activación-síntesis','Neurociencia: energía eléctrica aleatoria y trama coherente']],tip:'Cinco etapas: 1, 2, 3, 4 y MOR; cada una con ondas cerebrales distintas.'},\ncards:[['Sueño','¿Qué ocurre en el sueño MOR?','Aumentan el ritmo cardiaco, la presión sanguínea y el ritmo respiratorio, y ocurren las imágenes oníricas.'],['Freud','Contenido manifiesto vs. latente','Manifiesto: el aparente guión del sueño. Latente: su significado verdadero, que revela deseos insatisfechos.'],['Trastornos','¿Qué es la narcolepsia?','Una necesidad incontrolable de dormir.']]});\nSUM.push({points:['La conciencia es la noción de las sensaciones, pensamientos y sentimientos; hay estados alterados naturales e inducidos.','El sueño atraviesa cinco etapas con ondas cerebrales distintas; el sueño MOR incluye las imágenes oníricas.','Tres explicaciones de los sueños: cumplimiento de deseos (Freud), supervivencia y activación-síntesis.','Trastornos: insomnio, apnea, narcolepsia, somniloquía y sonambulismo.','Los ensueños son comunes y varían entre personas.'],tips:['Alerta de estudio: diferencie las cinco etapas del sueño.','Asocie cada teoría con su perspectiva: psicodinámica, evolutiva y neurociencia.']});\nEXTRA.push([['Término','¿Qué son los ritmos circadianos?','Ciclos biológicos de aproximadamente 24 horas, como el de sueño y vigilia.'],['Freud','¿Qué revela el contenido latente según Freud?','Los deseos insatisfechos del soñante.'],['Teoría','¿Qué propone la teoría de los sueños para la supervivencia?','Que la información relevante para la supervivencia cotidiana se reprocesa en los sueños.'],['Teoría','¿Qué propone activación-síntesis?','Que los sueños resultan de energía eléctrica aleatoria que estimula recuerdos integrados en una trama.'],['Trastorno','¿Qué es la apnea del sueño?','Dificultad para dormir y respirar al mismo tiempo.'],['Trastorno','¿Qué es el insomnio?','Un trastorno caracterizado por dificultades para dormir.']]);\nMORE.push(['Vigilia también varía de activa a pasiva.','Cada etapa tiene su patrón de ondas.','MOR = sueños vívidos y cuerpo activado.','Manifiesto = lo que se ve; latente = lo que significa.','Los sueños sirven para sobrevivir.','Los sueños como historia que el cerebro arma.','Cinco trastornos para distinguir.','Casi todos soñamos despiertos.']);\nDATA.push({n:13,name:'Hipnosis y meditación',center:'Hipnosis y meditación',branches:[\n['Hipnosis','Produce un estado de susceptibilidad acentuada a las sugestiones del hipnotizador.','Es un estado alterado de conciencia según una de las posturas.'],\n['Cambios bajo hipnosis','Mayor concentración y sugestión, mayor capacidad para recordar y elaborar imágenes, falta de iniciativa y aceptación de sugestiones que contradicen la realidad.','Ocurren cambios conductuales significativos.'],\n['¿Un estado diferente?','Una cuestión medular es si la hipnosis representa un estado de conciencia diferente o es similar a la conciencia de vigilia normal.','No hay acuerdo total entre los expertos.'],\n['El valor de la hipnosis','La hipnosis se usa, por ejemplo, para aliviar el dolor.','Ver también módulo 10: técnicas para aliviar el dolor.'],\n['Meditación','Es una técnica que se aprende para reenfocar la atención y que genera un estado alterado de conciencia.','Hay diversas técnicas, todas buscan reconcentrar la atención.'],\n['Culturas','Las diferentes culturas han desarrollado sus propias formas únicas para alterar los estados de conciencia.','La experiencia de la conciencia está influida por la cultura.']],\nmn:{title:'Hipnosis = Hipnotizador sugiere; Meditación = Mente enfocada',tiles:[['H','Hipnosis','Susceptibilidad acentuada a la sugestión'],['M','Meditación','Técnica aprendida para reenfocar la atención']],tip:'Pregunta clave: ¿es la hipnosis un estado de conciencia diferente de la vigilia?'},\ncards:[['Hipnosis','¿Qué es la hipnosis?','Un estado de susceptibilidad acentuada a las sugestiones del hipnotizador.'],['Meditación','¿Qué es la meditación?','Una técnica aprendida para reenfocar la atención que genera un estado alterado de conciencia.'],['Debate','¿Cuál es la cuestión medular sobre la hipnosis?','Si es un estado de conciencia diferente o similar a la vigilia normal.']]});\nSUM.push({points:['La hipnosis produce una susceptibilidad acentuada a las sugestiones.','Bajo hipnosis hay más concentración, más capacidad de imaginar y recordar e iniciativa reducida.','Se debate si es un estado de conciencia diferente o no.','La meditación reenfoca la atención y genera un estado alterado de conciencia.','Cada cultura desarrolló sus propias formas de alterar la conciencia.'],tips:['Alerta de estudio: la pregunta de si la hipnosis es un estado distinto es un aspecto medular.','Todas las técnicas de meditación buscan reconcentrar la atención.','Compare hipnosis y meditación: quién dirige la experiencia.']});\nEXTRA.push([['Contraste','Hipnosis vs. meditación','Hipnosis: se guía por las sugestiones del hipnotizador. Meditación: técnica que la persona aprende para reenfocar su atención.'],['Efecto','¿Qué cambios hay bajo hipnosis?','Mayor concentración y sugestión, mejor imaginación y recuerdo, falta de iniciativa.'],['Cultura','¿Qué dice el texto sobre las culturas?','Cada una desarrolló formas únicas de alterar los estados de conciencia.'],['Aplicación','¿Para qué puede usarse la hipnosis?','Por ejemplo, para aliviar el dolor.'],['Definición','¿Qué es un estado alterado de conciencia?','Un estado distinto de la vigilia normal: sueño, hipnosis, drogas, meditación.'],['Debate','¿Por qué hay debate sobre la hipnosis?','Porque no es claro si es un estado diferente o similar a la conciencia de vigilia.']]);\nMORE.push(['Hipnotizador sugiere; la persona se vuelve más receptiva.','Se acepta incluso lo que contradice la realidad.','Dos posturas: estado especial o vigilia normal.','Aplicación práctica en el dolor.','Reconcentrar la atención es el núcleo.','La cultura moldea las prácticas.']);\nDATA.push({n:14,name:'Drogas',center:'Drogas y conciencia',branches:[\n['Drogas psicoactivas','Pueden producir un estado alterado de conciencia. Varían en cuán peligrosas son y en si son o no adictivas (drogas adictivas).','Se clasifican en cuatro categorías.'],\n['Estimulantes','Producen excitación en el sistema nervioso central. Comunes: cafeína y nicotina. Más peligrosas: cocaína y anfetaminas, que en grandes cantidades pueden generar convulsiones y muerte.','Incluye MDMA según algunas clasificaciones.'],\n['Depresores','Disminuyen la excitación en el sistema nervioso central; causan intoxicación y euforia. Los más comunes: alcohol y barbitúricos.','También se citan Rohipnol y similares.'],\n['Alcohol','Es el depresor más consumido. Sus efectos iniciales son liberar la tensión y generar sentimientos positivos, pero se vuelven depresivos al aumentar la dosis. Herencia y factores de estrés pueden conducir al alcoholismo.','']\n,['Narcóticos','Morfina y heroína relajan y alivian el dolor y la ansiedad; por su cualidad adictiva son particularmente peligrosas.','Son drogas narcóticas.'],\n['Alucinógenos','Producen alucinaciones u otros cambios en la percepción. El más consumido es la mariguana, con varios riesgos a largo plazo. Otros: LSD y éxtasis.','']\n,['Abuso y ayuda','Hay síntomas que indican cuándo el consumo se convierte en abuso. Quien sospecha un problema debe buscar ayuda profesional, por la dificultad de resolverlo por cuenta propia.','']],\nmn:{title:'Eso Débilmente Nubla Ahora: las cuatro categorías de drogas',tiles:[['E','Estimulantes','Excitan el SNC: cafeína, nicotina, cocaína, anfetaminas'],['D','Depresores','Disminuyen la excitación: alcohol, barbitúricos'],['N','Narcóticos','Alivian dolor y ansiedad: morfina, heroína'],['A','Alucinógenos','Alteran la percepción: mariguana, LSD, éxtasis']],tip:'Las cuatro categorías: estimulantes, depresores, narcóticos y alucinógenos.'},\ncards:[['Categorías','¿Cuáles son las categorías de drogas?','Estimulantes, depresores, narcóticos y alucinógenos.'],['Alcohol','¿Qué efecto tiene el alcohol al aumentar la dosis?','Los efectos iniciales de liberación de la tensión se vuelven depresivos.'],['Ayuda','¿Qué debe hacer quien sospecha un problema con drogas?','Buscar ayuda profesional.']]});\nSUM.push({points:['Las drogas psicoactivas alteran la conciencia y difieren en peligrosidad y capacidad adictiva.','Estimulantes: excitan el SNC (cafeína, nicotina; cocaína y anfetaminas son las más peligrosas).','Depresores: disminuyen la excitación; el alcohol es el más consumido.','Narcóticos: morfina y heroína, muy adictivas; alucinógenos: mariguana, LSD y éxtasis.','Conviene reconocer los síntomas de abuso y buscar ayuda profesional.'],tips:['Memorice las cuatro categorías con la frase mnemotécnica.','Distinga «peligrosa» de «adictiva»: no son lo mismo.']});\nEXTRA.push([['Estimulantes','¿Qué hacen los estimulantes?','Producen excitación en el sistema nervioso central.'],['Depresores','¿Qué hacen los depresores?','Disminuyen la excitación en el SNC y pueden causar intoxicación y euforia.'],['Narcóticos','¿Qué son la morfina y la heroína?','Narcóticos: drogas que relajan y alivian el dolor y la ansiedad; muy adictivas.'],['Alucinógenos','¿Cuál es el alucinógeno más consumido?','La mariguana.'],['Alcohol','¿Qué factores influyen en el alcoholismo?','La herencia y los factores ambientales de estrés.'],['Término','¿Qué es una droga psicoactiva?','Una sustancia que altera el estado de conciencia.']]);\nMORE.push(['Todas alteran la conciencia; no todas son igual de peligrosas.','Cocaína y anfetaminas: riesgo de convulsiones y muerte.','Alcohol: de la desinhibición a la depresión.','Narcóticos: alivio del dolor y alta adicción.','Alucinógenos: cambian la percepción.','El abuso necesita apoyo profesional.','Ayuda externa.']);\nDATA.push({n:15,name:'Condicionamiento clásico',center:'Aprendizaje por condicionamiento clásico',branches:[\n['Aprendizaje','Es un cambio relativamente permanente en el comportamiento derivado de la experiencia.','El condicionamiento clásico es una forma importante.'],\n['Estímulo neutro','Uno que normalmente no genera una respuesta relevante.','Se parea repetidamente con otro estímulo.'],\n['Estímulo y respuesta incondicionados','El estímulo incondicionado (EI) genera una respuesta natural no entrenada: la respuesta incondicionada (RI).','Ejemplo: la comida (EI) provoca salivación (RI).'],\n['Estímulo y respuesta condicionados','Después de asociaciones repetidas, el estímulo neutro se convierte en estímulo condicionado (EC) y provoca la respuesta condicionada (RC).','El estímulo neutro debe presentarse justo antes del EI.'],\n['Extinción','Ocurre cuando una respuesta aprendida disminuye en frecuencia y finalmente desaparece.','El aprendizaje no siempre es permanente.'],\n['Recuperación espontánea','La respuesta extinguida puede reaparecer tras un descanso.','Concepto de los términos clave.'],\n['Generalización y discriminación','Generalización: la respuesta condicionada sigue a estímulos similares pero no iguales. Discriminación: el organismo aprende a distinguir entre estímulos.','Generalización = similares; discriminación = diferentes.']],\nmn:{title:'N + I = C: el Neutro, apareado con el Incondicionado, se vuelve Condicionado',tiles:[['N','Estímulo neutro','No genera respuesta relevante'],['I','Estímulo incondicionado','Genera una respuesta natural no entrenada'],['C','Estímulo condicionado','Antes neutro, ahora provoca la respuesta aprendida'],['E','Extinción','La respuesta aprendida desaparece']],tip:'La terminología del condicionamiento clásico puede ser confusa: practique con ejemplos propios.'},\ncards:[['Definición','¿Qué es el aprendizaje?','Un cambio relativamente permanente en el comportamiento derivado de la experiencia.'],['Proceso','¿Cómo ocurre el condicionamiento clásico?','Un estímulo neutro se parea repetidamente con un EI justo antes de este hasta que provoca la misma respuesta.'],['Contraste','Generalización vs. discriminación del estímulo','Generalización: respuesta a estímulos similares. Discriminación: distinguir entre estímulos.']]});\nSUM.push({points:['El aprendizaje es un cambio relativamente permanente en el comportamiento por la experiencia.','En el condicionamiento clásico, un estímulo neutro se parea con un EI y se vuelve EC.','El EI genera la RI; el EC genera la RC.','La extinción es la desaparición gradual de la respuesta; puede haber recuperación espontánea.','Generalización: estímulos similares; discriminación: estímulos diferentes.'],tips:['Generalización se relaciona con estímulos similares; discriminación, con diferentes.','Practique poniendo un ejemplo propio con EI, RI, EC y RC.']});\nEXTRA.push([['Términos','¿Qué es el EI?','El estímulo incondicionado: genera una respuesta natural no entrenada.'],['Términos','¿Qué es la RC?','La respuesta condicionada: la respuesta al estímulo condicionado.'],['Extinción','¿Qué es la extinción?','La disminución y desaparición de una respuesta aprendida.'],['Recuperación','¿Qué es la recuperación espontánea?','La reaparición de una respuesta ya extinguida.'],['Orden','¿Cuándo debe presentarse el estímulo neutro?','Justo antes del estímulo incondicionado.'],['Generalización','¿Qué es la generalización del estímulo?','La tendencia de la respuesta condicionada a seguir a un estímulo similar pero no igual al condicionado original.']]);\nMORE.push(['Aprender = cambio por experiencia.','Neutro no provoca nada relevante.','EI → RI: natural, sin entrenamiento.','EC → RC: aprendidos.','Si el EC deja de acompañarse del EI, la respuesta se apaga.','Puede volver aunque parecía extinguida.','Parecidos: generalizo; diferentes: discrimino.']);\nDATA.push({n:16,name:'Condicionamiento operante',center:'Condicionamiento operante',branches:[\n['Condicionamiento operante','Forma de aprendizaje en la que se fortalece o debilita una conducta voluntaria.','Según B. F. Skinner, el mecanismo principal es el reforzamiento.'],\n['Reforzamiento','Proceso por el cual un estímulo aumenta la probabilidad de que un comportamiento precedente se repita.','Reforzamiento = aumentar la conducta.'],\n['Reforzadores primarios y secundarios','Primarios: recompensas eficaces por naturaleza, sin experiencia previa; satisfacen una necesidad biológica. Secundarios: actúan como primarios por asociación con ellos.','Ejemplo de primario: comida; secundario: dinero.'],\n['Positivo y negativo','El reforzador positivo agrega un estímulo y aumenta la respuesta. El negativo elimina algo desagradable y también aumenta la respuesta.','Ambos aumentan la conducta.'],\n['Castigo','Disminuye la probabilidad de que ocurra la conducta. El positivo aplica un estímulo desagradable; el negativo elimina algo positivo.','El reforzamiento vence al castigo.'],\n['Programas de reforzamiento','Continuo vs. parcial (intermitente). El parcial produce un aprendizaje más sólido y duradero. Razón fija/variable (por número de respuestas); intervalo fijo/variable (por tiempo).','Razón = respuestas; intervalo = tiempo.'],\n['Discriminación, generalización y moldeamiento','El control de estímulos es análogo a la discriminación del estímulo. El moldeamiento refuerza aproximaciones sucesivas a una conducta que no se da en forma natural.','Modificación conductual aplica estos principios.']],\nmn:{title:'Positivo = poner, Negativo = quitar; Refuerzo sube, Castigo baja',tiles:[['R+','Refuerzo positivo','Agrega algo agradable: la conducta aumenta'],['R−','Refuerzo negativo','Quita algo desagradable: la conducta aumenta'],['C+','Castigo positivo','Agrega algo desagradable: la conducta disminuye'],['C−','Castigo negativo','Quita algo agradable: la conducta disminuye']],tip:'Programas: Razón fija/variable = por cantidad de respuestas; Intervalo fijo/variable = por tiempo transcurrido.'},\ncards:[['Skinner','¿Cuál es el mecanismo central del condicionamiento operante?','El reforzamiento.'],['Contraste','Reforzador primario vs. secundario','Primario: satisface una necesidad biológica sin experiencia previa. Secundario: es eficaz por su asociación con un primario.'],['Programas','¿Qué programa produce un aprendizaje más duradero?','Los de reforzamiento parcial (intermitente), en los que no se refuerza cada ensayo.']]});\nSUM.push({points:['El condicionamiento operante fortalece o debilita conductas voluntarias.','El reforzamiento aumenta la conducta (positivo: agrega; negativo: quita algo desagradable); el castigo la disminuye.','Los reforzadores pueden ser primarios o secundarios.','Los programas parciales producen aprendizaje más sólido que el continuo: razón fija/variable e intervalo fijo/variable.','El moldeamiento y la modificación conductual aplican estos principios.'],tips:['Alerta de estudio: las diferencias entre refuerzo positivo/negativo y castigo positivo/negativo son difíciles; repase las definiciones.','Los programas influyen en la rapidez y la duración del aprendizaje.','Pregunta de repaso: ¿se agregó o se quitó? ¿la conducta subió o bajó?']});\nEXTRA.push([['Programas','Razón vs. intervalo','Razón: se basa en la cantidad de respuestas. Intervalo: se basa en el tiempo transcurrido.'],['Castigo','Castigo positivo vs. negativo','Positivo: aplica un estímulo desagradable. Negativo: elimina algo positivo.'],['Reforzador','¿Qué es un reforzador negativo?','Un estímulo que elimina algo desagradable y aumenta la respuesta precedente.'],['Técnica','¿Qué es el moldeamiento?','Reforzar aproximaciones sucesivas a una conducta que no se da de forma natural.'],['Aplicación','¿Qué es la modificación conductual?','Aplicar principios del condicionamiento para generar un cambio de conducta.'],['Comparación','Clásico vs. operante','Clásico: asociar estímulos y respuestas involuntarias. Operante: consecuencias de una conducta voluntaria.']]);\nMORE.push(['Skinner es la figura clave.','Reforzar = subir la probabilidad de repetir.','Primario: biología; secundario: asociación.','Negativo no es castigo: también aumenta la conducta.','Castigo quiere suprimir la conducta.','Elegir el programa cambia la duración del aprendizaje.','Aproximaciones sucesivas.']);\nDATA.push({n:17,name:'Enfoques cognitivos del aprendizaje',center:'Aprendizaje cognitivo y observacional',branches:[\n['Modelos cognitivos','Consideran el aprendizaje en términos de procesos de pensamiento o cognición.','Se enfocan en pensamientos y expectativas internos de quienes aprenden.'],\n['Aprendizaje latente','Se aprende un nuevo comportamiento, pero no se realiza hasta que se proporciona un incentivo para hacerlo.','Sustenta los modelos cognitivos.'],\n['Mapas cognitivos','El aparente desarrollo de mapas mentales del ambiente sustenta los modelos cognitivos.','Ejemplo: conocer un camino aunque no se haya recorrido por recompensa.'],\n['Aprendizaje por observación','El aprendizaje ocurre también al observar el comportamiento de los demás (modelos).','La conducta recompensada del modelo se imita más.'],\n['Violencia observada','La observación de la violencia se relaciona con una mayor probabilidad de actuar agresivamente después.','Resultado de investigación sobre modelado.'],\n['Estilos de aprendizaje','Son formas características de abordar el aprendizaje según los antecedentes culturales y las capacidades de cada persona (por ejemplo, analítico o relacional).','Pueden reflejar antecedentes familiares o culturales.']],\nmn:{title:'Lo Mejor Observar Experiencias: enfoques cognitivos',tiles:[['L','Latente','Se aprende, pero no se muestra sin incentivo'],['M','Mapas cognitivos','Representaciones mentales del ambiente'],['O','Observación','Se aprende viendo a modelos'],['E','Estilos','Maneras características de aprender']],tip:'Cognitivo = pensamientos internos; clásico y operante = estímulos, respuestas y reforzamientos externos.'},\ncards:[['Latente','¿Qué es el aprendizaje latente?','Aprender un comportamiento que no se realiza hasta que hay un incentivo.'],['Observación','¿Qué determina si se imita una conducta observada?','La naturaleza del reforzamiento o castigo que recibe el modelo.'],['Contraste','Modelo cognitivo vs. condicionamiento','El cognitivo se enfoca en pensamientos y expectativas internos; el clásico y el operante, en estímulos, respuestas y reforzamientos externos.']]});\nSUM.push({points:['Los modelos cognitivos explican el aprendizaje por procesos de pensamiento.','El aprendizaje latente y los mapas cognitivos los sustentan.','El aprendizaje por observación depende del reforzamiento o castigo que recibe el modelo.','Observar violencia aumenta la probabilidad de actuar con agresividad después.','Los estilos de aprendizaje reflejan antecedentes culturales y capacidades.'],tips:['Alerta de estudio: modelo cognitivo = pensamientos internos; los otros = factores externos.','Los modelos recompensados se imitan más que los castigados.','Piense en un ejemplo propio de aprendizaje por observación.']});\nEXTRA.push([['Observación','¿Qué es el aprendizaje por observación?','Aprender observando el comportamiento de otros.'],['Imitación','¿Cuándo es más probable imitar a un modelo?','Cuando el modelo es recompensado por su conducta.'],['Latente','Ejemplo de aprendizaje latente','Aprender una conducta que solo se manifiesta cuando aparece un incentivo.'],['Mapas','¿Qué sustentan los mapas cognitivos?','Los modelos cognitivos del aprendizaje.'],['Estilo','¿Qué reflejan los estilos de aprendizaje?','Antecedentes culturales y capacidades únicas de cada persona.'],['Violencia','¿Qué se asocia con observar violencia?','Una mayor probabilidad de actuar agresivamente después.']]);\nMORE.push(['Pensamiento y expectativa importan.','Hay aprendizaje sin conducta visible.','El cerebro representa el ambiente.','Mire cómo se premia al modelo.','Modelos violentos pueden influir.','No hay un solo estilo correcto.']);\nDATA.push({n:18,name:'Fundamentos de la memoria',center:'La memoria',branches:[\n['Qué es la memoria','Es el proceso por el cual codificamos, almacenamos y recuperamos información.','Tres procesos: codificar, almacenar, recuperar.'],\n['Memoria sensorial','Es el primer lugar donde se guarda la información; cada sistema sensorial tiene la suya. Es muy breve, pero precisa: almacena réplicas casi exactas de un estímulo.','Primer almacén.'],\n['Memoria de corto plazo','Mantiene aproximadamente 7 ± 2 unidades («trozos») de información durante 15 a 25 segundos; si no se transfiere a la memoria de largo plazo, se pierde.','Los recuerdos se transfieren mediante el repaso.'],\n['Memoria de trabajo','Concepción de la memoria de corto plazo como un espacio activo donde la información se recupera, se maneja y se mantiene por repaso. Tiene un procesador ejecutivo central, un almacén visual, uno verbal y una memoria episódica.','Se relaciona con el razonamiento y la toma de decisiones.'],\n['Memoria de largo plazo','Si los recuerdos se transfieren a ella se vuelven relativamente permanentes. Se concibe en módulos de memoria, cada uno relacionado con sistemas separados del cerebro.','Declarativa y procedimental.'],\n['Tipos de memoria de largo plazo','Declarativa (episódica y semántica) y procedimental. Las redes semánticas representan conocimientos como conjuntos de información interconectados.',''],\n['Neurociencia de la memoria','El hipocampo y la amígdala son especialmente importantes en el establecimiento de la memoria. Los recuerdos se distribuyen por todo el cerebro.','No son «minibodegas» en lugares fijos.']],\nmn:{title:'CAR: Codificar, Almacenar, Recuperar',tiles:[['C','Codificar','Convertir la información para guardarla'],['A','Almacenar','Mantenerla: sensorial, corto y largo plazo'],['R','Recuperar','Traerla de vuelta cuando se necesita']],tip:'Orden de los almacenes: sensorial → corto plazo (7 ± 2 trozos; 15 a 25 segundos) → largo plazo (por repaso).'},\ncards:[['Definición','¿Qué es la memoria?','El proceso por el cual codificamos, almacenamos y recuperamos información.'],['Corto plazo','¿Cuánta información cabe en la memoria de corto plazo y cuánto dura?','Cerca de 7 ± 2 unidades, durante 15 a 25 segundos, si no se transfiere.'],['Largo plazo','Memoria declarativa vs. procedimental','Declarativa: hechos y sucesos (episódica y semántica). Procedimental: habilidades y procedimientos.']]});\nSUM.push({points:['La memoria es codificar, almacenar y recuperar información.','Los almacenes son sensorial (breve y precisa), de corto plazo (7 ± 2; 15 a 25 s) y de largo plazo (relativamente permanente).','El repaso transfiere información al largo plazo.','La memoria de largo plazo incluye la declarativa (episódica y semántica) y la procedimental.','El hipocampo y la amígdala son clave; los recuerdos se distribuyen por todo el cerebro.'],tips:['Alerta de estudio: los tres tipos de memoria son sistemas distintos, no bodegas físicas.','Ejercicio: agrupe en «trozos» un número telefónico para recordarlo.']});\nEXTRA.push([['Término','¿Qué es la memoria de trabajo?','Una concepción de la memoria de corto plazo como espacio donde la información se maneja y se mantiene por repaso.'],['Término','¿Qué es un trozo (chunk)?','Una unidad de información.'],['Largo plazo','¿Qué es la memoria episódica?','Un tipo de memoria declarativa sobre sucesos personales.'],['Largo plazo','¿Qué es la memoria semántica?','Un tipo de memoria declarativa de conocimientos generales.'],['Cerebro','¿Qué estructuras son importantes en la memoria?','El hipocampo y la amígdala.'],['Redes','¿Qué son las redes semánticas?','Conjuntos de información interconectados que representan conocimientos en la memoria de largo plazo.']]);\nMORE.push(['Tres procesos: CAR.','Casi un reflejo exacto, pero muy breve.','7 ± 2 trozos, segundos.','Piense en la memoria de trabajo como un escritorio activo.','Largo plazo = relativamente permanente.','Declarativa = saber qué; procedimental = saber cómo.','Los recuerdos están distribuidos.']);\nDATA.push({n:19,name:'Recuperación y recuerdo',center:'Recordar y fallas de la memoria',branches:[\n['Punta de la lengua','Es la incapacidad temporal de recordar información que se tiene la certeza de saber.','Las claves de recuperación ayudan a recordar.'],\n['Niveles de procesamiento','La forma en que se percibe y analiza inicialmente la información determina cuán bien se recuerda: a mayor profundidad inicial, mejor recuerdo.','Teoría de los niveles de procesamiento.'],\n['Recordar y reconocer','Recordar es recuperar información específica; reconocer es identificar o distinguir información presentada en otro material.','Ejemplo: una pregunta abierta vs. una de opción múltiple.'],\n['Memoria explícita e implícita','Explícita: recuerdo deliberado o consciente. Implícita: recuerdos de los que no somos conscientes pero influyen en el desempeño posterior (preparación).','Ver también memorias repentinas.'],\n['Memorias repentinas','Son recuerdos centrados en un suceso específico importante. Cuanto más distintivo es el recuerdo, más fácil es recuperarlo.','Recuerdo vívido de un hecho importante.'],\n['Memoria constructiva y esquemas','Relacionamos los recuerdos con significados, conjeturas y expectativas. Los esquemas son conjuntos de información organizados que sesgan cómo se interpreta, almacena y recuerda la información nueva.','La memoria es un proceso constructivo.'],\n['Testigos oculares','Los testigos tienen probabilidades de cometer errores sustanciales al recordar detalles de los delitos; el problema es más agudo cuando son niños.','Memoria en los tribunales.'],\n['Recuerdo autobiográfico','Los procesos constructivos influyen en el recuerdo autobiográfico: el pasado se encuentra con el presente.','']],\nmn:{title:'Recordar = Recuperar; Reconocer = Reconocer entre opciones; Explícita = Expresa',tiles:[['R','Recordar','Recuperar información específica sin opciones'],['R','Reconocer','Identificar información entre opciones'],['E','Explícita','Recuerdo consciente y deliberado'],['I','Implícita','Influye sin que lo notemos']],tip:'La memoria es constructiva: el significado que damos a lo recordado influye en el recuerdo.'},\ncards:[['Fallas','¿Qué es el fenómeno de la punta de la lengua?','La incapacidad temporal de recordar información que se tiene la certeza de saber.'],['Contraste','Recordar vs. reconocer','Recordar: recuperar información específica. Reconocer: identificar información presentada en otro material.'],['Constructiva','¿Qué es un esquema?','Un conjunto de información organizado y almacenado que sesga cómo se interpreta, almacena y recuerda información nueva.']]});\nSUM.push({points:['La punta de la lengua y las claves de recuperación muestran cómo funciona el recuerdo.','El procesamiento profundo mejora el recuerdo (niveles de procesamiento).','La memoria explícita es consciente; la implícita influye sin que lo notemos.','La memoria es un proceso constructivo y los esquemas sesgan lo que recordamos.','Los testigos oculares, sobre todo los niños, pueden cometer errores importantes.'],tips:['Alerta de estudio: distinga recordar (recuperar) de reconocer (identificar).','Un hecho clave: la memoria es constructiva.','Para estudiar, procese el material de manera profunda en vez de repetirlo sin pensar.']});\nEXTRA.push([['Tipos','¿Qué es la memoria implícita?','Recuerdos de los que no somos conscientes pero que influyen en el desempeño y el comportamiento posteriores.'],['Tipos','¿Qué es la memoria explícita?','El recuerdo deliberado o consciente de información.'],['Niveles','¿Qué dice la teoría de los niveles de procesamiento?','Cuanto más profundo es el procesamiento inicial, mejor es el recuerdo.'],['Repentina','¿Qué son las memorias repentinas?','Recuerdos centrados en un suceso específico importante.'],['Tribunal','¿Por qué la memoria de testigos oculares es un problema?','Pueden cometer errores sustanciales al recordar los detalles de un delito.'],['Término','¿Qué es la preparación (priming)?','Una influencia implícita de la información previa en el desempeño posterior.']]);\nMORE.push(['Se sabe, pero no sale.','Procesar con profundidad, no superficial.','Examen abierto = recordar; opción múltiple = reconocer.','Lo implícito influye sin avisar.','Lo distintivo se recupera mejor.','Recordar es reconstruir.','La confianza del testigo no garantiza exactitud.','El presente influye en cómo se cuenta el pasado.']);\nDATA.push({n:20,name:'Olvido y deterioro de la memoria',center:'Olvido y trastornos de la mem os anteriores. Anterógrada: dificultad para formar nuevos recuerdos.']]});\nSUM.push({points:['Los procesos del olvido son decaimiento, interferencia (proactiva y retroactiva) y olvido dependiente de claves.','El Alzheimer genera pérdida progresiva de la memoria.','La amnesia puede ser retrógrada o anterógrada.','El síndrome de Korsakoff afecta a alcohólicos crónicos.','Para mejorar la memoria: palabra clave, especificidad de la codificación, organización, practicar y sobreaprender.'],tips:['Alerta de estudio: decaimiento = falta de uso; interferencia = otra información presente.','Salvo el Alzheimer, los trastornos de la memoria son relativamente raros.','Practique repasando en intervalos para lograr el sobreaprendizaje.']});\nEXTRA.push([['Técnica','¿Qué es la técnica de la palabra clave?','Una técnica para memorizar vocabulario de otros idiomas.'],['Técnica','¿Qué es el sobreaprendizaje?','Practicar y repasar el material más allá del dominio inicial.'],['Alzheimer','¿Qué es la enfermedad de Alzheimer?','Una enfermedad que genera pérdida progresiva de la memoria.'],['Korsakoff','¿A quiénes afecta el síndrome de Korsakoff?','A los alcohólicos a largo plazo.'],['Olvido','¿Qué es el olvido dependiente de las claves?','El olvido por faltar las claves apropiadas de recuperación.'],['Amnesia','¿Qué es la amnesia?','Una pérdida de memoria sin otras dificultades mentales.']]);\nMORE.push(['Si no se usa, se desvanece.','Compite con otra información.','Una buena clave rescata el recuerdo.','Es progresivo.','Hacia atrás vs. hacia adelante.','Efecto del alcohol a largo plazo.','Estudie en distintas formas y repase.']);\nconst mk=(m,area,q,r,w,e)=>({m,area,q,o:[r,...w],a:0,e});\nconst QX=[null,[],[],[],[],[]];\nQX[1].push(\nmk(0,'Neurona: partes','¿Qué parte de la neurona detecta mensajes de otras neuronas?','Las dendritas',['El axón','La vaina de mielina','Los botones terminales'],'Los axones transmiten señales que se alejan de la neurona.'),\nmk(0,'Ley de todo o nada','La le
