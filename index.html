  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"9c061d7e-4659-4b9f-a539-f345feaf6dab\"><\u002Fscript>\n<script src=\"6d95fbad-0405-4a44-bf21-3d4892c9b8d4\"><\u002Fscript>\n<script src=\"ea635f6a-46ba-4052-9845-bed0ea72ea66\"><\u002Fscript>\n<script src=\"6d4c3660-4b34-4aed-9ed0-9169b84e13f0\"><\u002Fscript>\n<script src=\"85ac210f-a937-4a48-a2a8-108bd263f13e\"><\u002Fscript>\n<script src=\"ed65f0c0-b22c-4f74-9ecd-925a5938c0d2\"><\u002Fscript>\n<script src=\"7f99a4ba-e7ab-4f6d-9945-c5e692bf946e\"><\u002Fscript>\n<script src=\"4ab05d2a-3397-4dc8-bf86-3f78b3ed309b\"><\u002Fscript>\n<script src=\"3a968735-a976-4947-928f-665efa702ecf\"><\u002Fscript>\n<script src=\"8860b353-f204-42ed-afe5-e90f66df5bb6\"><\u002Fscript>\n<script src=\"f55a848e-e80e-4ef3-ade9-5cfb627e795c\"><\u002Fscript>\n<script src=\"d7fdd9c1-e023-432e-b787-09807fe80290\"><\u002Fscript>\n<script src=\"50211023-696f-4ad5-85d6-56bbb818a7be\"><\u002Fscript>\n<style>:root{--color-accent:#5b2a86;--color-accent-400:#a98bd0;--color-accent-600:#4a216f;--color-accent-700:#3d1a5c}body{margin:0;background:var(--color-bg)}a{color:var(--color-accent-700)}a:hover{color:var(--color-accent-600)}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(91,42,134,.45)}50%{box-shadow:0 0 0 14px rgba(91,42,134,0)}}<\u002Fstyle>\n<\u002Fhelmet>\n<sc-if value=\"{{ viewHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"font-family:var(--font-body);color:var(--color-text);max-width:1080px;margin:0 auto;padding:24px 24px 80px\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-bottom:24px\">\n    <a href=\"mailto:?subject=Gu%C3%ADa%20de%20Estudio%20-%20Fundamentos%20de%20Psicolog%C3%ADa&amp;body=Te%20comparto%20esta%20gu%C3%ADa%20de%20estudio%3A%20https%3A%2F%2Fjberrios27.github.io%2FPSYU300%2F\" style=\"font:inherit;font-size:13px;font-weight:600;text-decoration:none;color:var(--color-text);background:#fff;border:2px solid #c9a227;padding:6px 12px\" style-hover=\"background:#f6ecc4\">Compartir por email<\u002Fa>\n    <a href=\"mailto:josean.berrios@icloud.com?subject=Error%20en%20Gu%C3%ADa%20de%20Estudio%20-%20PSYU-300\" style=\"font:inherit;font-size:13px;font-weight:600;text-decoration:none;color:var(--color-text);background:#fff;border:2px solid var(--color-accent);padding:6px 12px\" style-hover=\"background:var(--color-neutral-200)\">Reportar Error<\u002Fa>\n    <button sc-camel-on-click=\"{{ resetResults }}\" style=\"font:inherit;font-size:13px;font-weight:600;background:#fff;border:2px solid var(--color-neutral-500);padding:6px 12px;cursor:pointer;color:var(--color-neutral-700)\" style-hover=\"background:var(--color-neutral-200)\">Borrar todas las contestaciones<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"border-bottom:4px solid #c9a227;padding-bottom:28px\">\n    <div style=\"font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700);font-weight:600\">FUNDAMENTOS DE PSICOLOGÍA<\u002Fdiv>\n    <h1 style=\"font-family:var(--font-heading);font-size:clamp(40px,7vw,80px);line-height:.98;margin:12px 0 0;font-weight:800\">Guía de Estudio<\u002Fh1>\n    \n  <\u002Fdiv>\n\n  <div style=\"margin-top:24px;border:2px solid var(--color-text);border-top:5px solid #c9a227;background:#fff;padding:18px 22px\">\n    <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);font-weight:700\">Aviso importante<\u002Fdiv>\n    <p style=\"margin:6px 0 0;line-height:1.55\">Esta guía fue creada con inteligencia artificial a partir del material del curso. Puede contener errores u omisiones. El estudiante es responsable de repasar su material del curso, sus notas y de leer el libro <b>Psicología con aplicaciones de América Latina, 12th Edition, Robert S. Feldman.<\u002Fb><\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 1fr;border:2px solid var(--color-divider);margin-top:32px;background:#fff\">\n    <div style=\"background:var(--color-accent);color:#e8c65a;font-family:var(--font-heading);font-weight:800;font-size:72px;display:flex;align-items:center;justify-content:center\">1<\u002Fdiv>\n    <div style=\"padding:24px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center\">\n      <div style=\"max-width:56ch;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"font-family:var(--font-heading);font-size:30px;font-weight:800;line-height:1.1\">Pre-prueba<\u002Fdiv>\n        <div style=\"line-height:1.5;color:var(--color-neutral-700)\">60 preguntas de los 20 módulos (3 por módulo) para medir su punto de partida.<\u002Fdiv>\n        <div style=\"font-weight:700\">{{ home.pre }}<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ startPre }}\" style=\"font:inherit;font-weight:700;background:{{ home.preBg }};color:{{ home.preFg }};border:0;padding:14px 24px;cursor:{{ home.preCur }};white-space:nowrap\">{{ home.preLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 1fr;border:2px solid var(--color-divider);border-top:0;background:#fff\">\n    <div style=\"background:var(--color-accent);color:#e8c65a;font-family:var(--font-heading);font-weight:800;font-size:72px;display:flex;align-items:flex-start;justify-content:center;padding-top:16px\">2<\u002Fdiv>\n    <div style=\"padding:24px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"max-width:62ch;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"font-family:var(--font-heading);font-size:30px;font-weight:800;line-height:1.1\">Estudiar los capítulos<\u002Fdiv>\n        <div style=\"line-height:1.5;color:var(--color-neutral-700)\">Cada capítulo termina con un quiz de 5 preguntas. Se marca como completado al responder 70 % o más (4 de 5).<\u002Fdiv>\n        <div style=\"font-weight:700\">{{ home.s2 }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));border:2px solid var(--color-divider)\">\n        <sc-for list=\"{{ home.chapters }}\" as=\"cp\" hint-placeholder-count=\"6\">\n          <div style=\"padding:20px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300);display:flex;flex-direction:column;gap:12px;background:{{ cp.bg }}\">\n            <div style=\"display:flex;gap:14px;align-items:flex-start\">\n              <div style=\"font-family:var(--font-heading);font-weight:800;font-size:52px;line-height:.9;color:var(--color-accent)\">{{ cp.n }}<\u002Fdiv>\n              <div><div style=\"font-family:var(--font-heading);font-weight:800;font-size:20px;line-height:1.15\">{{ cp.name }}<\u002Fdiv><div style=\"font-size:14px;margin-top:2px;font-weight:600;color:{{ cp.col }}\">{{ cp.status }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:6px\">\n              <sc-for list=\"{{ cp.mods }}\" as=\"md\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ md.go }}\" style=\"font:inherit;text-align:left;cursor:pointer;padding:9px 12px;border:2px solid var(--color-text);background:#fff;line-height:1.25;font-size:15px\" style-hover=\"background:var(--color-neutral-200)\"><b>{{ md.n }}<\u002Fb> · {{ md.name }}<\u002Fbutton>\n              <\u002Fsc-for>\n              <button sc-camel-on-click=\"{{ cp.quizGo }}\" style=\"font:inherit;text-align:left;cursor:pointer;padding:9px 12px;border:2px solid var(--color-text);background:var(--color-text);color:#fff;line-height:1.25;font-size:15px;font-weight:700\" style-hover=\"background:var(--color-neutral-700)\">{{ cp.quizLabel }} →<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 1fr;border:2px solid var(--color-divider);border-top:0;background:#fff\">\n    <div style=\"background:var(--color-accent);color:#e8c65a;font-family:var(--font-heading);font-weight:800;font-size:72px;display:flex;align-items:center;justify-content:center\">3<\u002Fdiv>\n    <div style=\"padding:24px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center\">\n      <div style=\"max-width:56ch;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"font-family:var(--font-heading);font-size:30px;font-weight:800;line-height:1.1\">Prueba final<\u002Fdiv>\n        <div style=\"line-height:1.5;color:var(--color-neutral-700)\">60 preguntas distintas a las de la pre-prueba (3 por módulo). Se habilita al completar los 6 capítulos. Para aprobar se necesita 70 % o más.<\u002Fdiv>\n        <div style=\"font-weight:700\">{{ home.post }}<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ startPost }}\" style=\"font:inherit;font-weight:700;background:{{ home.postBg }};color:{{ home.postFg }};border:0;padding:14px 24px;cursor:{{ home.postCur }};white-space:nowrap\">{{ home.postLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 1fr;border:2px solid var(--color-divider);border-top:0;background:#fff\">\n    <div style=\"background:var(--color-accent);color:#e8c65a;font-family:var(--font-heading);font-weight:800;font-size:72px;display:flex;align-items:center;justify-content:center\">4<\u002Fdiv>\n    <div style=\"padding:24px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center\">\n      <div style=\"max-width:56ch;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"font-family:var(--font-heading);font-size:30px;font-weight:800;line-height:1.1\">Comparar resultados<\u002Fdiv>\n        <div style=\"line-height:1.5;color:var(--color-neutral-700)\">Compare la pre-prueba con la prueba final y vea qué capítulos y módulos repasar.<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ openCompare }}\" style=\"font:inherit;font-weight:700;background:var(--color-text);color:#fff;border:0;padding:14px 24px;cursor:pointer;white-space:nowrap\" style-hover=\"background:var(--color-neutral-700)\">Ver resultados →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:var(--font-heading);font-size:32px;margin:48px 0 4px;font-weight:800;display:inline-block;border-bottom:4px solid #c9a227;padding-bottom:4px\">Herramientas de estudio<\u002Fh2>\n  <p style=\"margin:0 0 16px;color:var(--color-neutral-700)\">Acceso directo, sin pasar por los capítulos.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));border:2px solid var(--color-divider);background:#fff\">\n    <div style=\"padding:24px;border-right:1px solid var(--color-neutral-300);display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-family:var(--font-heading);font-size:26px;font-weight:800;line-height:1.1\">Flashcards de términos<\u002Fdiv>\n      <div style=\"line-height:1.5;color:var(--color-neutral-700)\">Todos los términos clave de los 6 capítulos.<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ openFlash }}\" style=\"font:inherit;font-weight:700;background:var(--color-text);color:#fff;border:0;padding:12px 20px;cursor:pointer;text-align:left;margin-top:auto\" style-hover=\"background:var(--color-neutral-700)\">Abrir flashcards →<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"padding:24px;border-right:1px solid var(--color-neutral-300);display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-family:var(--font-heading);font-size:26px;font-weight:800;line-height:1.1\">Mnemotécnicas<\u002Fdiv>\n      <div style=\"line-height:1.5;color:var(--color-neutral-700)\">Las 20 mnemotécnicas reunidas en un solo lugar.<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ openMnemo }}\" style=\"font:inherit;font-weight:700;background:var(--color-text);color:#fff;border:0;padding:12px 20px;cursor:pointer;text-align:left;margin-top:auto\" style-hover=\"background:var(--color-neutral-700)\">Ver mnemotécnicas →<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"padding:24px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-family:var(--font-heading);font-size:26px;font-weight:800;line-height:1.1\">Retos por capítulo<\u002Fdiv>\n      <div style=\"line-height:1.5;color:var(--color-neutral-700)\">Preguntas difíciles con retroalimentación inmediata, y mnemotécnica.<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ openRetos }}\" style=\"font:inherit;font-weight:700;background:var(--color-accent);color:#fff;border:0;padding:12px 20px;cursor:pointer;text-align:left;margin-top:auto\" style-hover=\"background:var(--color-accent-600)\">Elegir capítulo →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ viewFlash }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-family:var(--font-body);color:var(--color-text);max-width:880px;margin:0 auto;padding:64px 24px 80px\">\n  <div style=\"font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700);font-weight:600\">Herramienta de estudio<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-heading);font-size:clamp(32px,5vw,56px);line-height:1;margin:8px 0 16px;font-weight:800\">Flashcards de términos<\u002Fh1>\n  <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px\">\n    <sc-for list=\"{{ fc.chips }}\" as=\"fch\" hint-placeholder-count=\"7\"><button sc-camel-on-click=\"{{ fch.go }}\" style=\"font:inherit;font-weight:600;cursor:pointer;padding:8px 14px;border:2px solid var(--color-text);background:{{ fch.bg }};color:{{ fch.fg }}\">{{ fch.label }}<\u002Fbutton><\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"font-weight:600;margin-bottom:8px\">Tarjeta {{ fc.i }} de {{ fc.n }}<\u002Fdiv>\n  <button sc-camel-on-click=\"{{ fc.flip }}\" style=\"display:block;width:100%;font:inherit;text-align:left;cursor:pointer;min-height:300px;padding:32px;border:2px solid var(--color-text);background:{{ fc.bg }};color:{{ fc.fg }};transition:background .3s\">\n    <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85\">{{ fc.tag }}<\u002Fdiv>\n    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:{{ fc.size }};line-height:1.2;margin-top:14px\">{{ fc.text }}<\u002Fdiv>\n    <sc-if value=\"{{ fc.flipped }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-family:var(--font-heading);font-size:22px;line-height:1.7;margin-top:14px\"><sc-for list=\"{{ fc.parts }}\" as=\"pt\" hint-placeholder-count=\"10\"><span style=\"font-weight:{{ pt.fw }};background:{{ pt.bg }};color:{{ pt.fg }};padding:{{ pt.pad }}\">{{ pt.t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><div style=\"font-size:13px;margin-top:18px;opacity:.9\">Las palabras resaltadas son las claves para asociar con el término.<\u002Fdiv><\u002Fsc-if>\n  <\u002Fbutton>\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\">\n    <button sc-camel-on-click=\"{{ fc.prev }}\" style=\"font:inherit;font-weight:600;cursor:pointer;padding:10px 18px;border:2px solid var(--color-text);background:#fff\" style-hover=\"background:var(--color-neutral-200)\">← Anterior<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ fc.flip }}\" style=\"font:inherit;font-weight:600;cursor:pointer;padding:10px 18px;border:2px solid var(--color-text);background:#fff\" style-hover=\"background:var(--color-neutral-200)\">Voltear<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ fc.next }}\" style=\"font:inherit;font-weight:600;cursor:pointer;padding:10px 18px;border:2px solid var(--color-text);background:var(--color-text);color:#fff\">Siguiente →<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ fc.shuffle }}\" style=\"font:inherit;font-weight:600;cursor:pointer;padding:10px 18px;border:2px solid var(--color-text);background:#fff;margin-left:auto\" style-hover=\"background:var(--color-neutral-200)\">Mezclar<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ viewQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-family:var(--font-body);color:var(--color-text);max-width:1080px;margin:0 auto;padding:64px 24px 80px\">\n  <div style=\"font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700);font-weight:600\">Capítulo {{ chN }}: {{ chName }}<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-heading);font-size:clamp(32px,5vw,56px);line-height:1;margin:8px 0 8px;font-weight:800\">Quiz del Capítulo {{ chN }}<\u002Fh1>\n  <p style=\"margin:0 0 16px;color:var(--color-neutral-700)\">{{ examIntro }}<\u002Fp>\n\n  <sc-if value=\"{{ qStart }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"border:2px solid var(--color-divider);background:#fff;padding:28px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center\">\n      <div style=\"line-height:1.5;max-width:52ch\">Responda sin consultar la guía. No hay retroalimentación hasta terminar.<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ qBegin }}\" style=\"font:inherit;font-weight:700;background:var(--color-accent);color:#fff;border:0;padding:14px 28px;cursor:pointer;white-space:nowrap\" style-hover=\"background:var(--color-accent-600)\">Comenzar quiz →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ qOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"border:2px solid var(--color-divider);background:#fff\">\n      <div style=\"height:8px;background:var(--color-neutral-200)\"><div style=\"height:100%;background:var(--color-accent);width:{{ qpct }}%;transition:width .4s\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:28px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);font-weight:600\">Pregunta {{ qn }} de {{ qtotal }} · Módulo {{ qmod }}<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-size:clamp(20px,3vw,28px);font-weight:700;line-height:1.25\">{{ qtext }}<\u002Fdiv>\n        <div style=\"display:grid;gap:8px\">\n          <sc-for list=\"{{ qopts }}\" as=\"op\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ op.pick }}\" style=\"font:inherit;text-align:left;cursor:pointer;padding:14px 16px;border:2px solid var(--color-text);background:{{ op.bg }};color:{{ op.fg }};display:grid;grid-template-columns:32px 1fr;line-height:1.4\"><b>{{ op.l }}<\u002Fb><span>{{ op.t }}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ qPrev }}\" style=\"font:inherit;font-weight:600;cursor:pointer;padding:10px 18px;border:2px solid var(--color-text);background:#fff;opacity:{{ qprevO }}\">← Anterior<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ qNext }}\" style=\"font:inherit;font-weight:600;cursor:pointer;padding:10px 18px;border:2px solid var(--color-text);background:var(--color-text);color:#fff;opacity:{{ qnextO }}\">{{ qnextL }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ qEnd }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"border:2px solid var(--color-divider);background:#fff\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))\">\n        <div style=\"padding:28px;background:var(--color-accent);color:#fff\">\n          <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase\">Su puntuación<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(64px,10vw,104px);line-height:1;margin-top:8px\">{{ res.score }}<span style=\"font-size:.4em\"> / {{ res.total }}<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:700;margin-top:4px\">{{ res.pct }}% · {{ res.level }}<\u002Fdiv>\n          <div style=\"line-height:1.5;margin-top:8px\">{{ res.msg }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:28px\">\n          <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);font-weight:600;margin-bottom:12px\">Resultado por módulo<\u002Fdiv>\n          <sc-for list=\"{{ res.mods }}\" as=\"md\" hint-placeholder-count=\"4\">\n            <div style=\"margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;gap:8px;font-weight:600\"><span>Módulo {{ md.n }}: {{ md.name }}<\u002Fspan><span>{{ md.ok }}/{{ md.tot }}<\u002Fspan><\u002Fdiv>\n              <div style=\"height:12px;background:var(--color-neutral-200);margin-top:4px\"><div style=\"height:100%;width:{{ md.pct }}%;background:{{ md.col }};transition:width .8s\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size:13px;margin-top:2px;color:var(--color-neutral-700)\">{{ md.tag }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top:2px solid var(--color-divider);padding:28px\">\n        <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);font-weight:600;margin-bottom:4px\">Áreas para reforzar o repasar<\u002Fdiv>\n        <sc-if value=\"{{ res.allGood }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"line-height:1.5;padding:8px 0\">Respondió correctamente todas las preguntas. Repase las tarjetas de cada módulo para mantener lo aprendido.<\u002Fdiv><\u002Fsc-if>\n        <sc-for list=\"{{ res.weak }}\" as=\"wk\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--color-neutral-300)\">\n            <div style=\"flex:1;min-width:220px\"><div style=\"font-weight:700\">{{ wk.area }}<\u002Fdiv><div style=\"font-size:14px;color:var(--color-neutral-700)\">Módulo {{ wk.n }} · {{ wk.name }}<\u002Fdiv><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ wk.go }}\" style=\"font:inherit;font-weight:600;cursor:pointer;padding:8px 14px;border:2px solid var(--color-text);background:#fff\" style-hover=\"background:var(--color-neutral-200)\">Repasar módulo {{ wk.n }} ↑<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"border-top:2px solid var(--color-divider);padding:28px\">\n        <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);font-weight:600;margin-bottom:4px\">Revisión de respuestas<\u002Fdiv>\n        <sc-for list=\"{{ res.rows }}\" as=\"rw\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:36px 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--color-neutral-300)\">\n            <div style=\"font-family:var(--font-heading);font-weight:800;font-size:20px;color:{{ rw.col }}\">{{ rw.mark }}<\u002Fdiv>\n            <div style=\"line-height:1.45\">\n              <div style=\"font-weight:600\">{{ rw.i }}. {{ rw.q }}<\u002Fdiv>\n              <div style=\"font-size:14px;margin-top:4px\">Su respuesta: {{ rw.mine }}<\u002Fdiv>\n              <div style=\"font-size:14px\">Correcta: {{ rw.right }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:var(--color-neutral-700);margin-top:2px\">{{ rw.why }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid var(--color-divider);padding:20px 28px\">\n        <button sc-camel-on-click=\"{{ qBegin }}\" style=\"font:inherit;font-weight:700;background:var(--color-accent);color:#fff;border:0;padding:12px 24px;cursor:pointer\" style-hover=\"background:var(--color-accent-600)\">↻ Repetir quiz<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ isFinalCh }}\" hint-placeholder-val=\"{{ false }}\">\n    <button sc-camel-on-click=\"{{ goFinal }}\" style=\"font:inherit;display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;margin-top:32px;padding:24px;border:2px solid var(--color-text);background:{{ finalBg }};color:{{ finalFg }};cursor:{{ finalCur }};text-align:left\">\n      <span><span style=\"display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase\">Paso 3<\u002Fspan><span style=\"display:block;font-family:var(--font-heading);font-weight:800;font-size:clamp(20px,3vw,30px);margin-top:4px\">{{ finalLabel }}<\u002Fspan><span style=\"display:block;margin-top:6px;line-height:1.4\">{{ finalNote }}<\u002Fspan><\u002Fspan>\n      <span style=\"font-size:32px\">→<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ hasNextCh }}\" hint-placeholder-val=\"{{ false }}\">\n    <button sc-camel-on-click=\"{{ nextCh }}\" style=\"font:inherit;display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;margin-top:32px;padding:24px;border:2px solid var(--color-text);background:var(--color-accent);color:#fff;cursor:pointer;text-align:left\" style-hover=\"background:var(--color-accent-600)\">\n      <span><span style=\"display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase\">Siguiente capítulo<\u002Fspan><span style=\"display:block;font-family:var(--font-heading);font-weight:800;font-size:clamp(20px,3vw,30px);margin-top:4px\">{{ nextChName }}<\u002Fspan><\u002Fspan>\n      <span style=\"font-size:32px\">→<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ viewMnemo }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-family:var(--font-body);color:var(--color-text);max-width:1080px;margin:0 auto;padding:64px 24px 80px\">\n  <div style=\"font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700);font-weight:600\">Herramienta de estudio<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-heading);font-size:clamp(32px,5vw,56px);line-height:1;margin:8px 0 16px;font-weight:800\">Técnicas mnemotécnicas<\u002Fh1>\n  <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px\">\n    <sc-for list=\"{{ mnem.chips }}\" as=\"mch\" hint-placeholder-count=\"7\"><button sc-camel-on-click=\"{{ mch.go }}\" style=\"font:inherit;font-weight:600;cursor:pointer;padding:8px 14px;border:2px solid var(--color-text);background:{{ mch.bg }};color:{{ mch.fg }}\">{{ mch.label }}<\u002Fbutton><\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-for list=\"{{ mnem.groups }}\" as=\"mg\" hint-placeholder-count=\"2\">\n    <h2 style=\"font-family:var(--font-heading);font-size:30px;margin:36px 0 12px;font-weight:800\">Capítulo {{ mg.n }}: {{ mg.name }}<\u002Fh2>\n    <div style=\"display:grid;gap:16px\">\n      <sc-for list=\"{{ mg.items }}\" as=\"mi\" hint-placeholder-count=\"3\">\n        <div style=\"border:2px solid var(--color-divider);background:#fff\">\n          <div style=\"padding:16px 22px;border-bottom:2px solid var(--color-divider)\">\n            <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);font-weight:600\">Módulo {{ mi.n }} · {{ mi.name }}<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-weight:700;font-size:20px;line-height:1.25;margin-top:4px\">{{ mi.title }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))\">\n            <sc-for list=\"{{ mi.tiles }}\" as=\"mt\" hint-placeholder-count=\"4\"><div style=\"padding:16px;border-right:1px solid var(--color-neutral-300)\"><div style=\"font-family:var(--font-heading);font-size:44px;font-weight:800;line-height:1;color:var(--color-accent)\">{{ mt.l }}<\u002Fdiv><div style=\"font-weight:700;margin-top:6px\">{{ mt.w }}<\u002Fdiv><div style=\"font-size:14px;line-height:1.4;margin-top:2px;color:var(--color-neutral-700)\">{{ mt.d }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"padding:12px 22px;border-top:1px solid var(--color-neutral-300);font-size:15px;color:var(--color-neutral-700);line-height:1.45\">{{ mi.tip }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ viewRetos }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:{{ rt.bgc }};min-height:100vh;font-family:{{ rt.ff }};font-size:{{ rt.fs }};line-height:{{ rt.lh }};letter-spacing:{{ rt.ls }};color:#1a1a1a\">\n<div style=\"max-width:820px;margin:0 auto;padding:72px 24px 96px;display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between\">\n    <sc-if value=\"{{ rt.pNotSel }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ rt.choose }}\" style=\"font:inherit;font-weight:700;cursor:pointer;padding:12px 18px;border:2px solid #1a1a1a;background:#fff;min-height:48px\" style-hover=\"background:var(--color-neutral-200)\">← Volver a Retos por capítulo<\u002Fbutton>\n    <\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ rt.toggleSet }}\" aria-expanded=\"{{ rt.setOpen }}\" style=\"font:inherit;font-weight:700;cursor:pointer;padding:12px 18px;border:2px solid #1a1a1a;background:#fff;min-height:48px;margin-left:auto\" style-hover=\"background:var(--color-neutral-200)\">Ajustes de lectura<\u002Fbutton>\n  <\u002Fdiv>\n  <sc-if value=\"{{ rt.setOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"border:2px solid #1a1a1a;background:#fff;padding:20px;display:flex;flex-direction:column;gap:16px\">\n      <div><div style=\"font-weight:700;margin-bottom:6px\">Tamaño n><span style=\"display:block;font-family:var(--font-heading);font-weight:800;font-size:clamp(20px,3vw,30px);margin-top:4px\">{{ nextName }}<\u002Fspan><\u002Fspan>\n      <span style=\"font-size:32px\">→<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ hasPrev }}\" hint-placeholder-val=\"{{ false }}\">\n    <button sc-camel-on-click=\"{{ prevMod }}\" style=\"font:inherit;display:flex;align-items:center;gap:16px;width:100%;margin-top:12px;padding:20px 24px;border:2px solid var(--color-text);background:#fff;color:var(--color-text);cursor:pointer;text-align:left\" style-hover=\"background:var(--color-neutral-200)\">\n      <span style=\"font-size:28px\">←<\u002Fspan>\n      <span><span style=\"display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase\">Módulo anterior<\u002Fspan><span style=\"display:block;font-family:var(--font-heading);font-weight:800;font-size:clamp(18px,2.6vw,24px);margin-top:4px\">{{ prevName }}<\u002Fspan><\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isLast }}\" hint-placeholder-val=\"{{ false }}\">\n  <button sc-camel-on-click=\"{{ openQuizHere }}\" style=\"font:inherit;display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;margin-top:32px;padding:24px;border:2px solid var(--color-text);background:var(--color-text);color:#fff;cursor:pointer;text-align:left\" style-hover=\"background:var(--color-neutral-700)\">\n    <span><span style=\"display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase\">Final del capítulo<\u002Fspan><span style=\"display:block;font-family:var(--font-heading);font-weight:800;font-size:clamp(20px,3vw,30px);margin-top:4px\">Ir al quiz del Capítulo {{ chN }}<\u002Fspan><\u002Fspan>\n    <span style=\"font-size:32px\">→<\u002Fspan>\n  <\u002Fbutton>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst DATA=[\n{n:1,name:'Los psicólogos en acción',center:'Psicología: ciencia del comportamiento y los procesos mentales',\n branches:[\n ['Neurociencia conductual','Cómo el cerebro, el sistema nervioso y otros procesos biológicos determinan el comportamiento.','Ejemplo: vínculo entre sitios del cerebro y los temblores del Parkinson.'],\n ['Psicología experimental','Estudia sensación, percepción, aprendizaje y pensamiento. De ella nace la psicología cognitiva (memoria, razonamiento, lenguaje, decisiones).','Ejemplo: por qué caemos en ilusiones ópticas; escribir y manejar a la vez deteriora la conducción.'],\n ['Desarrollo y personalidad','Desarrollo: crecimiento y cambio desde la concepción hasta la muerte. Personalidad: consistencia del comportamiento y rasgos que distinguen a cada persona.','Ejemplo: primera sonrisa, primeros pasos, primera palabra.'],\n ['Salud, clínica y orientación','Salud: relación entre factores psicológicos y enfermedades físicas. Clínica: estudio, diagnóstico y tratamiento de trastornos. Orientación: problemas educativos, sociales y laborales, más específicos.','Ejemplo: efecto del estrés en la salud a largo plazo.'],\n ['Social e intercultural','Social: influencia de pensamientos, sentimientos y acciones de unos en otros. Intercultural: semejanzas y diferencias entre culturas y grupos étnicos.','Ejemplo: agresividad, amor, persuasión, obediencia; uso del castigo en la crianza según la cultura.'],\n ['Nuevas fronteras','Evolutiva: herencia genética de los ancestros (Darwin, selección natural). Genética conductual: genes y cromosomas. Neuropsicología clínica: une neurociencia y psicología clínica.','Ejemplo: la timidez o los celos podrían tener raíz genética y ayudar a la supervivencia.'],\n ['Dónde trabajan','Mayoría en ambientes académicos; también práctica privada, hospitales, clínicas, escuelas, empresas, gobierno y prisiones. Tres roles: maestro, científico y profesional clínico.','Ejemplo: consultor industrial-organizacional en una empresa.']],\n mn:{title:'Cada Mente Vive Sana y Social: las cinco preguntas que ordenan los subcampos',tiles:[['C','Cerebro','Neurociencia conductual'],['M','Mundo','Experimental y cognitiva'],['V','Vida','Desarrollo y personalidad'],['S','Sana','Salud, clínica y orientación'],['S','Social','Social e intercultural']],tip:'Roles del psicólogo: Maestro, Científico, Clínico (MCC).'},\n cards:[['Definición','¿Qué es la psicología?','Estudio científico del comportamiento y los procesos mentales.'],['Contraste','Psicología clínica vs. orientación psicológica','Clínica: trastornos, de crisis cotidianas a depresión profunda. Orientación: problemas educativos, sociales y de adaptación profesional.'],['Evolutiva','¿En qué se apoya la psicología evolutiva?','En Darwin y la selección natural: rasgos y conductas que ayudaron a sobrevivir y reproducirse. Se critica que minimiza el ambiente.']]},\n{n:2,name:'Una ciencia evoluciona',center:'Enfoques de la psicología',\n branches:[\n ['Estructuralismo','Wundt y Titchener: dividir la mente en sus componentes básicos mediante la introspección.','Clave: la estructura, las piezas.'],\n ['Funcionalismo','William James: qué función cumplen la mente y el comportamiento para adaptarse al ambiente.','Clave: para qué sirve.'],\n ['Psicología Gestalt','Percibimos patrones y totalidades, no solo elementos aislados.','Clave: el todo.'],\n ['Neurociencia','Conducta explicada por procesos biológicos: cerebro, genes, hormonas.','Clave: sangre, sudor y miedos.'],\n ['Psicodinámica','Freud: fuerzas inconscientes internas, impulsos y conflictos de la infancia.','Clave: la persona interna.'],\n ['Conductual','Solo la conducta observable, moldeada por el ambiente y el aprendizaje.','Clave: la persona externa.'],\n ['Cognitiva','Cómo pensamos, comprendemos, recordamos y procesamos la información.','Clave: las raíces de la comprensión.'],\n ['Humanista','Cualidades únicas de la especie: libre albedrío y búsqueda del potencial propio.','Clave: elección y crecimiento.']],\n mn:{title:'Niños Pequeños Comen Cereal Hoy: las cinco perspectivas actuales',tiles:[['N','Neurociencia','Biología del comportamiento'],['P','Psicodinámica','Fuerzas inconscientes'],['C','Conductual','Conducta observable'],['C','Cognitiva','Pensamiento y memoria'],['H','Humanista','Libre albedrío y potencial']],tip:'Escuelas tempranas: Estructuralismo = Estructura (piezas); Funcionalismo = Función; Gestalt = Global. Controversias: naturaleza-crianza, consciente-inconsciente, libre albedrío-determinismo, observable-interno, estabilidad-cambio.'},\n cards:[['Contraste','Estructuralismo vs. funcionalismo','Estructuralismo: componentes de la mente por introspección. Funcionalismo: para qué sirven la mente y la conducta.'],['Controversia','Libre albedrío vs. determinismo','Libre albedrío: elegimos nuestros actos. Determinismo: factores fuera de nuestro control los determinan.'],['Perspectiva','¿Qué estudia la perspectiva cognitiva?','Cómo las personas piensan, comprenden y conciben el mundo.']]},\n{n:3,name:'La investigación en la psicología',center:'Método científico',\n branches:[\n ['Teorías','Explicaciones generales de un fenómeno de interés.','Se concretan en hipótesis.'],\n ['Hipótesis','Predicciones comprobables derivadas de una teoría; requieren una definición operacional.','Se ponen a prueba con investigación.'],\n ['Investigación documental','Examinar registros existentes para poner a prueba una hipótesis.','Riesgo: pueden no existir datos o ser inútiles.'],\n ['Observación naturalista','Observar el comportamiento en su ambiente real sin intervenir.','Riesgo: la gente cambia si sabe que la observan.'],\n ['Encuestas','Preguntar directamente a una muestra de personas sobre su comportamiento.','Riesgo: la gente puede mentir para dar buena imagen.'],\n ['Estudio de caso','Investigación profunda de una persona o grupo pequeño.','Limitado para generalizar.'],\n ['Correlacional','Busca si dos variables se relacionan.','Correlación no implica causalidad.'],\n ['Experimental','Manipula una variable y asigna al azar a grupo experimental y grupo control.','Única que establece causa y efecto.']],\n mn:{title:'Don Nicolás Enseña Casos Con Experimentos: los seis métodos',tiles:[['D','Documental','Registros existentes'],['N','Naturalista','Observar sin intervenir'],['E','Encuesta','Preguntar a una muestra'],['C','Caso','Estudio profundo'],['C','Correlacional','Relación, no causa'],['E','Experimental','Manipular y controlar']],tip:'Variable Independiente: la que Impone el investigador. Variable Dependiente: Depende de lo que haga el participante.'},\n cards:[['Experimento','Grupo experimental vs. grupo control','El experimental recibe el tratamiento; el control no. La asignación aleatoria los hace comparables.'],['Variables','Independiente y dependiente','Independiente: la que manipula el experimentador. Dependiente: la que se mide como resultado.'],['Principio','¿Qué significa «correlación no implica causalidad»?','Dos variables relacionadas no prueban que una cause la otra.']]},\n{n:4,name:'Cuestiones fundamentales',center:'Ética y validez de la investigación',\n branches:[\n ['Proteger del daño','Los participantes deben protegerse de daño físico y mental.','Ética de la investigación.'],\n ['Privacidad','Derecho de los participantes a la privacidad sobre su conducta.','Ética de la investigación.'],\n ['Participación voluntaria','La participación es completamente voluntaria; se puede abandonar en cualquier momento.','Ética de la investigación.'],\n ['Consentimiento informado','Antes de participar se informa el procedimiento general, los riesgos posibles y el derecho a retirarse.','Documento firmado por el participante.'],\n ['Diversidad','Elegir participantes que representen la diversidad del comportamiento humano.','Muestras representativas.'],\n ['Animales','Se debate su uso en la investigación; se pesan los beneficios frente al daño.','Pregunta abierta del módulo.'],\n ['Sesgo experimental','Factores que amenazan la validez del experimento; el placebo ayuda a controlarlo.','Ejemplo: participantes que se comportan según lo que creen esperado.']],\n mn:{title:'DPV: Daño, Privacidad, Voluntad',tiles:[['D','Daño','Proteger a los participantes'],['P','Privacidad','Resguardar su conducta'],['V','Voluntad','Participación libre']],tip:'Consentimiento informado = Procedimiento + Riesgos + Retiro.'},\n cards:[['Ética','¿Qué incluye el consentimiento informado?','Procedimiento general, riesgos posibles y derecho a retirarse en cualquier momento.'],['Definición','¿Qué es un placebo?','Tratamiento sin efecto activo usado para controlar el sesgo experimental.'],['Diversidad','¿Por qué usar participantes representativos?','Para que los resultados reflejen la diversidad del comportamiento humano.']]}\n];\nconst SUM=[\n{points:['La psicología es el estudio científico del comportamiento y los procesos mentales: incluye lo que la gente hace, pero también pensamientos, emociones, percepciones, recuerdos y actividad biológica.','Sus metas: describir, predecir y explicar el comportamiento, y ayudar a mejorar la vida de las personas.','Usa métodos científicos, más válidos que la intuición y la especulación.','Los subcampos son como un árbol genealógico: distintos entre sí, unidos por la meta de entender el comportamiento.','La mayoría de los psicólogos trabaja en ambientes académicos, donde combina los roles de maestro, científico y clínico.'],tips:['Alerta de estudio: conocer los subcampos permite ver un mismo comportamiento desde distintas expresiones.','«Experimental» engaña: psicólogos de todas las especialidades usan técnicas experimentales.','Al estudiar, asocie cada subcampo con su pregunta guía (cerebro, mundo, vida, salud, social).']},\n{points:['La psicología nació de la introspección y de tres escuelas tempranas: estructuralismo, funcionalismo y Gestalt.','Hoy hay cinco perspectivas principales: neurociencia, psicodinámica, conductual, cognitiva y humanista.','Ninguna perspectiva es la única correcta: cada una explica el mismo comportamiento desde un ángulo distinto.','Las controversias fundamentales: naturaleza-crianza, consciente-inconsciente, libre albedrío-determinismo, observable-interno y estabilidad-cambio.','Hubo mujeres fundadoras de la psicología, a menudo poco reconocidas.'],tips:['Alerta de estudio: aprenda las perspectivas comparando cómo cada una explicaría una misma conducta.','Relacione cada perspectiva con una figura o frase clave (Freud: psicodinámica; James: funcionalismo).','Naturaleza-crianza: la mayoría de los psicólogos hoy acepta que ambas influyen.']},\n{points:['El método científico: identificar preguntas, formular explicaciones, llevar a cabo la investigación y comunicar los resultados.','Una teoría explica en general; una hipótesis es una predicción comprobable, con definición operacional.','Investigación descriptiva: documental, observación naturalista, encuestas y estudio de caso.','Solo el experimento permite concluir causa y efecto: variable independiente (manipulada), variable dependiente (medida), grupo experimental, grupo control y asignación aleatoria.','Un resultado significativo y la réplica de la investigación dan confianza en los hallazgos.'],tips:['Alerta de estudio: «correlación no implica causalidad» es un principio clave.','Para cada método, memorice también su debilidad (datos inútiles, observados que cambian, mentiras en encuestas).','Pregunta de repaso: ¿qué cambió el investigador y qué se midió?']},\n{points:['La ética de la investigación protege a los participantes: del daño, en su privacidad y con participación voluntaria.','El consentimiento informado incluye procedimiento, riesgos y el derecho a retirarse en cualquier momento.','Los participantes deben representar la diversidad del comportamiento humano.','El uso de animales se debate pesando beneficios y daño.','El sesgo experimental amenaza la validez; el placebo ayuda a controlarlo.'],tips:['Alerta de estudio: para elegir la respuesta ética, busque protección, voluntariedad e información completa.','Ser consumidor informado de la psicología significa pensar críticamente: ¿quién investigó, con qué muestra y qué método?','Cuidado con «todas las anteriores»: en consentimiento informado, procedimiento, riesgos y retiro van juntos.']}\n];\nconst EXTRA=[\n[['Neurociencia','¿Qué estudia la neurociencia conductual?','Cómo el cerebro, el sistema nervioso y otros procesos biológicos determinan el comportamiento.'],['Desarrollo','Psicología del desarrollo vs. de la personalidad','Desarrollo: crecimiento y cambio de la concepción a la muerte. Personalidad: consistencia del comportamiento y rasgos que distinguen a las personas.'],['Social','Psicología social vs. intercultural','Social: influencia de los pensamientos, sentimientos y acciones de unos en otros. Intercultural: semejanzas y diferencias entre culturas y grupos étnicos.'],['Roles','¿Cuáles son los tres roles del psicólogo?','Maestro, científico y profesional clínico; la mayoría trabaja en ambientes académicos.'],['Fronteras','¿Qué estudia la genética conductual?','Los mecanismos biológicos, como genes y cromosomas, que permiten que se desarrolle el comportamiento heredado.'],['Cognitiva','¿Qué procesos estudia la psicología cognitiva?','Pensamiento, memoria, razonamiento, resolución de problemas, juicio, toma de decisiones y lenguaje.']],\n[['Escuelas','¿Qué es el estructuralismo?','Dividir la mente en sus componentes básicos mediante la introspección (Wundt y Titchener).'],['Escuelas','¿Qué propone la psicología Gestalt?','Percibimos patrones y totalidades, no solo elementos aislados.'],['Perspectiva','¿Qué explica la perspectiva psicodinámica?','El comportamiento por fuerzas inconscientes internas; su figura clave es Freud.'],['Perspectiva','Conductual vs. humanista','Conductual: solo la conducta observable, moldeada por el ambiente. Humanista: libre albedrío y búsqueda del potencial propio.'],['Controversia','Naturaleza vs. crianza','¿Pesa más la herencia o el ambiente? La mayoría acepta que ambos influyen.'],['Término','¿Qué es la introspección?','Método en el que las personas describen lo que experimentan en su mente; base del estructuralismo.']],\n[['Método','¿Cuáles son los pasos del método científico?','Identificar preguntas, formular explicaciones, llevar a cabo la investigación y comunicar los resultados.'],['Conceptos','Teoría vs. hipótesis','Teoría: explicación general de un fenómeno. Hipótesis: predicción comprobable derivada de la teoría.'],['Descriptiva','¿Qué es la observación naturalista?','Observar el comportamiento en su ambiente real sin intervenir. Debilidad: la gente cambia si sabe que la observan.'],['Descriptiva','¿Y la investigación por encuestas?','Preguntar directamente a una muestra sobre su comportamiento. Debilidad: la gente puede mentir para dar buena imagen.'],['Experimento','¿Para qué sirve la asignación aleatoria?','Para que cada participante tenga la misma probabilidad de quedar en cualquier condición y los grupos sean comparables.'],['Experimento','¿Qué es una definición operacional?','Traducir la hipótesis a procedimientos concretos que se pueden medir o manipular.']],\n[['Ética','¿Qué tres derechos protege la ética?','Protección contra daño físico y mental, privacidad sobre su conducta y participación completamente voluntaria.'],['Validez','¿Qué es el sesgo experimental?','Factores que amenazan la validez del experimento, como las expectativas de los participantes o del experimentador.'],['Animales','¿Qué se debate sobre el uso de animales?','Si los beneficios de la investigación justifican el posible daño a los animales.'],['Consumidor','¿Qué es ser consumidor informado de la psicología?','Pensar críticamente: preguntar quién investigó, con qué muestra y con qué método.'],['Ética','¿Puede un participante abandonar el estudio?','Sí, en cualquier momento; es parte del consentimiento informado.'],['Diversidad','Participantes representativos','Elegirlos asegura que los hallazgos describan la diversidad del comportamiento humano y no solo a un grupo.']]\n];\nconst LENS=[['Neurociencia','Cerebro y biología'],['Psicodinámica','Fuerzas inconscientes'],['Conductual','Conducta aprendida'],['Cognitiva','Pensamientos'],['Humanista','Potencial y elección']];\nconst PERS=[\n['Neurociencia','Sangre, sudor y miedos','El comportamiento se explica por procesos biológicos del cuerpo.','¿Qué pasa en mi cerebro y mi cuerpo?','Cerebro, sistema nervioso, genes y hormonas.','Roger Sperry · Donald Hebb'],\n['Psicodinámica','La persona interna','Fuerzas inconscientes internas, en gran parte de la infancia, motivan la conducta (Freud).','¿Qué impulsos ocultos me mueven?','El inconsciente y los conflictos internos.','Sigmund Freud · Carl Jung · Erik Erikson'],\n['Conductual','La persona externa','Lo que importa es la conducta observable, moldeada por el ambiente y el aprendizaje.','¿Qué conducta se ve y qué la refuerza?','Estímulos, respuestas y consecuencias.','John B. Watson · B. F. Skinner · Ivan Pavlov'],\n['Cognitiva','Las raíces de la comprensión','Cómo las personas piensan, comprenden y conciben el mundo.','¿Cómo interpreto y proceso la información?','Pensamiento, memoria, razonamiento y lenguaje.','Jean Piaget · Ulric Neisser'],\n['Humanista','Cualidades únicas de la especie','Las personas eligen con libre albedrío y buscan desarrollar su potencial.','¿Qué elijo y qué puedo llegar a ser?','Libre albedrío, crecimiento y valoración personal.','Carl Rogers · Abraham Maslow']\n];\nconst SCENES=[\n{label:'Miedo a hablar en público',t:['Activación del sistema nervioso: el corazón se acelera y el cerebro responde como ante una amenaza.','Conflictos inconscientes o experiencias de la infancia que se expresan como ansiedad.','Una experiencia vergonzosa asociada al hablar; la evitación refuerza el miedo.','Pensamientos como «me van a juzgar» que distorsionan cómo se interpreta la situación.','Necesidad de aceptación y de crecer; el miedo frena el potencial de la persona.']},\n{label:'Un estudiante agresivo',t:['Factores biológicos: química cerebral, hormonas o genes que influyen en la agresividad.','Impulsos y conflictos internos reprimidos que salen en forma de hostilidad.','Conducta aprendida por imitación o porque fue reforzada en su entorno.','Interpreta las acciones de otros como hostiles y cree que la agresión resuelve los problemas.','Busca valoración y respeto; puede elegir otras formas de actuar con apoyo adecuado.']},\n{label:'Dificultad para dormir',t:['Alteración de procesos biológicos que regulan el sueño, como la actividad cerebral y las hormonas.','Preocupaciones y deseos inconscientes que perturban el descanso.','Hábitos asociados a la cama (pantallas, horarios) que mantienen el insomnio.','Pensamientos repetitivos sobre las tareas pendientes o sobre no poder dormir.','Insatisfacción con la propia vida o con metas personales que mantiene a la persona inquieta.']}\n];\nconst MORE=[\n['Ubica su estudio en la biología: cuerpo y cerebro como base de la conducta.','Se confunde con «experimental»: aquí el énfasis está en lo cognitivo y perceptivo; todas las ramas usan experimentos.','Desarrollo = cambio a lo largo de la vida; personalidad = lo que permanece estable.','Tres ramas para tres tipos de problema: salud (enfermedad física), clínica (trastornos), orientación (dificultades más específicas).','Social estudia a la persona con los demás; intercultural compara entre culturas.','La evolutiva y la genética conductual generan debate porque pueden minimizar la influencia del ambiente.','Maestro, Científico, Clínico: los tres roles se combinan en el ambiente académico.'],\n['Estructuralismo describe las piezas de la mente; el método era la introspección.','Funcionalismo pregunta «¿para qué sirve?»; lo representa William James.','Gestalt: el todo es más que la suma de sus partes.','Es la perspectiva más «biológica» de las cinco.','Mire hacia dentro: motivos que la persona misma no reconoce.','Solo cuenta lo que se puede observar y medir de la conducta.','Hoy domina gran parte de la investi
